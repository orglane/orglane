# Local development database for `make dev`. Not for production use: the
# credentials are fixed and the port is published on localhost only.
name: orglane-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orglane
      POSTGRES_PASSWORD: orglane
      POSTGRES_DB: orglane
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "orglane", "-d", "orglane"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
