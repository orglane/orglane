# Local development database for `make dev`. Not for production use: the
# credentials are fixed and the port is published on localhost only.
name: orglane-dev

services:
  mailpit:
    image: axllent/mailpit:v1.29.7
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: orglane
      POSTGRES_PASSWORD: orglane
      POSTGRES_DB: orglane
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      # Over TCP: PostgreSQL's temporary initialization server listens only
      # on the Unix socket, so a socket probe would pass too early (#78).
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "orglane", "-d", "orglane"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
