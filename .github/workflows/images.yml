# Container images (issue #10). See docs/releasing.md.
#
# Builds the two images of the root Dockerfile for linux/amd64 and
# linux/arm64 and publishes them with the same version tags:
#
#   ghcr.io/orglane/orglane        the core (default target)
#   ghcr.io/orglane/orglane-agent  the agent for managed services (target
#                                  agent: the same binary plus the pinned
#                                  Docker CLI and Compose plugin, ADR 0019)
#
# Each image carries an SBOM and a SLSA provenance attestation, and the
# binary reports the release version (`orglane cli version`). The installer
# pins the agent image by the digest of its version tag.
#
# Two jobs, so that overlapping releases cannot move an alias backwards:
#
#   build    runs per release and image, in parallel with other releases.
#            It pushes the image by digest, verifies it, and only then tags
#            the exact version (0.1.0). Exact tags are never shared between
#            releases.
#   promote  moves the shared aliases: latest (newest release) and X.Y
#            (newest patch of each line). It runs in one concurrency group for
#            all releases and recomputes one plan for both images from the
#            versions published for both (`ci release-aliases`), right before
#            it moves them. So the core and agent aliases always name the
#            same release, and a release that finishes after a newer one
#            leaves the aliases alone.
#            GitHub keeps one pending run per group and cancels older pending
#            ones; that is harmless, since every run reconciles all aliases.
#            Prereleases (v0.2.0-rc.1) are never promoted.
#
# Started by:
#   - the Release workflow (workflow_call) after release-please tags a
#     release: tags pushed with GITHUB_TOKEN start no workflows;
#   - a v* tag pushed by a maintainer, for example a prerelease.
#
# Minutes: it runs only for release tags, never for pull requests or pushes to
# main. One amd64 runner per image builds both architectures without
# emulation: the Dockerfile's build and download stages run on the build
# platform (Go cross-compiles), and the distroless final stages have no RUN
# step. QEMU is only used to smoke-test the arm64 images. Layers are cached in
# the GitHub Actions cache, one scope per image.
#
# Signing: the image is signed with keyless cosign. The signatures are
# recorded in Sigstore's public transparency log (Rekor), which publishes the
# repository and workflow names, so signing is skipped when the repository is
# private (for example a private mirror) to avoid disclosing them.
#
# Security: no pull request code runs here. Each job declares its own minimal
# permissions; the token pushes only to this repository's package. The tag
# reaches the shell through environment variables only. Third-party actions
# are pinned by commit SHA.

name: Images

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions: {}

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build and publish (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # An agent image without its core image (or the reverse) is useless:
      # the installer needs both of one version. Nothing is tagged before
      # its own verification, so a failed leg leaves no tag behind; the
      # other leg finishing does no harm.
      fail-fast: false
      matrix:
        include:
          - name: orglane
            suffix: ""
            target: core
            description: "Orglane core: server, agent and cli"
          - name: orglane-agent
            suffix: -agent
            target: agent
            description: "Orglane agent: installs and runs managed services with Docker Compose"
    concurrency:
      group: images-build-${{ inputs.tag || github.ref_name }}-${{ matrix.target }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # push to ghcr.io/<repository> and ghcr.io/<repository>-agent
      id-token: write # keyless cosign signing (skipped when the repository is private)
    env:
      PLATFORMS: linux/amd64,linux/arm64
      # ghcr.io/orglane/orglane or ghcr.io/orglane/orglane-agent.
      IMAGE: ghcr.io/${{ github.repository }}${{ matrix.suffix }}
      TARGET: ${{ matrix.target }}
    outputs:
      # The same for both legs.
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - id: tool
        uses: ./.github/actions/ci-tool

      - id: version
        name: Check the release tag
        env:
          CI_TOOL: ${{ steps.tool.outputs.path }}
        run: |
          "$CI_TOOL" release-version -tag "$TAG"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git log -1 --format=%cI HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Pushed by digest only: no tag points at the image until it is verified.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          # The checked-out tag, not the Git context of the triggering ref
          # (main when called from the Release workflow).
          context: .
          target: ${{ matrix.target }}
          platforms: ${{ env.PLATFORMS }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          # GHCR reads the description and the source of a multi-arch image
          # from its index; the source links a new package (the first agent
          # image) to this repository.
          annotations: |
            index:org.opencontainers.image.title=${{ matrix.name }}
            index:org.opencontainers.image.description=${{ matrix.description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.licenses=AGPL-3.0-or-later
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            index:org.opencontainers.image.revision=${{ steps.version.outputs.revision }}
            index:org.opencontainers.image.created=${{ steps.version.outputs.created }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=images-${{ matrix.target }}
          cache-to: type=gha,scope=images-${{ matrix.target }},mode=max

      - name: Verify the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/verify-image.sh "$IMAGE@$DIGEST" "$VERSION" "$PLATFORMS" "$TARGET"

      - id: visibility
        name: Check the repository visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "visibility=$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" >> "$GITHUB_OUTPUT"

      - if: steps.visibility.outputs.visibility == 'public'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        if: steps.visibility.outputs.visibility == 'public'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Publish the exact version
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
          VISIBILITY: ${{ steps.visibility.outputs.visibility }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          got=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          [ "$got" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION points at $got, want $DIGEST"; exit 1; }
          {
            echo "## Published $IMAGE:$VERSION"
            echo
            echo "Digest: \`$DIGEST\` ($PLATFORMS, SBOM and provenance attached)."
            if [ "$VISIBILITY" = public ]; then
              echo "Signed with cosign (keyless)."
            else
              echo "Not signed: the repository is $VISIBILITY (see docs/releasing.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  promote:
    name: Promote aliases
    needs: build
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One group for every release: alias promotions never run concurrently.
    concurrency:
      group: images-promote
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write # move latest and X.Y
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - id: tool
        uses: ./.github/actions/ci-tool

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # One plan for both images, from the versions published for both
      # (`ci release-aliases` with two -image flags): a release that
      # published only one of them (its other matrix leg failed or still
      # runs) moves no alias, so core and agent aliases always name the same
      # version (ADR 0019: the core works only with an agent of its version).
      # Both images are then moved to that same plan.
      - id: aliases
        name: Compute the aliases of both images from the registry
        env:
          CI_TOOL: ${{ steps.tool.outputs.path }}
          CORE_IMAGE: ghcr.io/${{ github.repository }}
          AGENT_IMAGE: ghcr.io/${{ github.repository }}-agent
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ github.token }}
        run: '"$CI_TOOL" release-aliases -image "$CORE_IMAGE" -image "$AGENT_IMAGE"'

      - name: Move the aliases of both images
        shell: bash
        env:
          CORE_IMAGE: ghcr.io/${{ github.repository }}
          AGENT_IMAGE: ghcr.io/${{ github.repository }}-agent
          ALIASES: ${{ steps.aliases.outputs.aliases }}
        run: |
          : > promote.log
          for image in "$CORE_IMAGE" "$AGENT_IMAGE"; do
            .github/scripts/promote-aliases.sh "$image" "$ALIASES" | sed "s|^|$image |" | tee -a promote.log
          done
          {
            echo "## Aliases after $TAG"
            echo
            sed 's/^/- /' promote.log | grep -E '^- [^ ]+ [^ ]+: '
          } >> "$GITHUB_STEP_SUMMARY"
