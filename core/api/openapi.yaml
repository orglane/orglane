openapi: 3.0.3
info:
  title: Orglane API
  version: 0.0.0
  description: |
    The unified Orglane API. The web UI, mobile app, modules and agents all use
    this same API (see docs/architecture.md).

    Conventions:
    - Product endpoints live under `/api/v1`. Only the health probes
      (`/healthz`, `/readyz`) and instance discovery (`/.well-known/orglane`)
      live outside the versioned prefix.
    - Every operation declares the permission it requires with the
      `x-orglane-permission` vendor extension (ADR 0004). The value `public`
      marks an operation that needs no authentication; `authenticated` marks
      self-service operations any signed-in caller may use on their own
      account; `demo` marks the operations of demo mode, which need no
      authentication and are served only when the instance runs in demo mode
      (otherwise they do not exist: 404). The server refuses to start, and
      the tests fail, if an operation has no permission.
    - Errors use RFC 9457 problem details (`application/problem+json`).

    Authentication (ADR 0003):
    - Browsers use the session cookie set by the sign-in operations
      (`__Host-orglane_session`; `orglane_session` in the local plain-HTTP
      demo mode). It is host-only, HttpOnly and SameSite=Lax. Every
      state-changing request authenticated with it must come from the
      workspace origin (`Origin` header) and carry the session's CSRF token
      in the `X-CSRF-Token` header (returned by sign-in and `GET /api/v1/me`).
    - Other clients use an OAuth 2.0 access token issued by the embedded
      OpenID Provider: `Authorization: Bearer <token>`.
    - The OpenID Provider endpoints (authorization code flow with PKCE,
      token, userinfo, revocation, introspection, end session, JWKS) are
      standard OpenID Connect and described by the discovery document at
      `/.well-known/openid-configuration`, not by this contract.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is running. Does not check dependencies.
      tags: [health]
      x-orglane-permission: public
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Returns 200 when the instance can serve traffic: the database is
        reachable and all migrations are applied. Returns 503 otherwise.
        Check details are logged by the server, not returned.
      tags: [health]
      x-orglane-permission: public
      responses:
        "200":
          description: The instance is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The instance is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Server version
      tags: [meta]
      x-orglane-permission: public
      responses:
        "200":
          description: The server version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Instance information
      description: Returns how this instance is addressed (ADR 0018).
      tags: [instance]
      x-orglane-permission: instance.read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /.well-known/orglane:
    get:
      operationId: getOrglaneDiscovery
      summary: Instance discovery
      description: |
        How clients (the mobile app, ADR 0012) find this instance's
        workspace, API and OpenID Provider from a work email domain
        (ADR 0018). Contains nothing sensitive.
      tags: [meta]
      x-orglane-permission: public
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrglaneDiscovery"
  /api/v1/auth/setup:
    get:
      operationId: getSetupStatus
      summary: First-run setup status
      description: Reports whether the instance still needs its first owner.
      tags: [auth]
      x-orglane-permission: public
      responses:
        "200":
          description: The setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: completeSetup
      summary: Create the first owner
      description: |
        Creates the first owner with a password and signs them in. Requires
        the one-time setup token printed in the server log on first start
        (or generated with `orglane cli setup-token`). Possible only while no
        owner exists. Sets the session cookie.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The owner was created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/sign-in:
    post:
      operationId: signInWithPassword
      summary: Sign in with a password
      description: |
        Signs in with a work email and password and sets the session cookie.
        Failures are rate limited per client address and per account; a
        locked account answers 429 even for the right password.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/passkey/options:
    post:
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      description: |
        Returns WebAuthn request options for `navigator.credentials.get`
        (discoverable credentials, no username needed) and the ceremony ID to
        finish with. The ceremony expires after 5 minutes and can be used
        once.
      tags: [auth]
      x-orglane-permission: public
      responses:
        "200":
          description: The WebAuthn options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/passkey:
    post:
      operationId: signInWithPasskey
      summary: Sign in with a passkey
      description: Verifies the WebAuthn assertion and sets the session cookie.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeySignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Revokes the current browser session and clears the session cookie.
      tags: [auth]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in person
      description: |
        Returns the caller, their permissions and, for browser sessions, the
        session, its CSRF token and whether to offer adding a passkey.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      summary: List my sessions
      description: The caller's valid sessions, oldest first.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: Revokes the session immediately; its next request is unauthenticated.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: List my passkeys
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addMyPasskey
      summary: Add a passkey
      description: Verifies the WebAuthn attestation from `navigator.credentials.create` and stores the passkey.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyRequest"
      responses:
        "201":
          description: The passkey was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      summary: Start adding a passkey
      description: |
        Returns WebAuthn creation options for `navigator.credentials.create`
        and the ceremony ID to finish with (`POST /api/v1/me/passkeys`).
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The WebAuthn options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkeys/{passkeyId}:
    delete:
      operationId: removeMyPasskey
      summary: Remove a passkey
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkey-offer/dismiss:
    post:
      operationId: dismissPasskeyOffer
      summary: Skip the passkey offer
      description: Remembers that the caller skipped adding a passkey; the offer returns after 30 days.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Dismissed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people:
    get:
      operationId: listPeople
      summary: List people
      description: |
        The people directory: everyone except offboarded people, sorted by
        display name. Any signed-in person may read it. Not paginated yet.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/avatar:
    get:
      operationId: getPersonAvatar
      summary: A person's avatar image
      description: |
        Returns the avatar image with its stored content type. Responses
        carry `X-Content-Type-Options: nosniff` and a sandboxing
        `Content-Security-Policy`, so an image opened directly cannot run
        scripts or load anything.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The avatar image.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/teams:
    get:
      operationId: listPersonTeams
      summary: A person's teams
      description: |
        The teams a person belongs to, with their role in each, sorted by
        name. Archived teams are not included. Any signed-in person may read
        it.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: The person's teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonTeamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: List teams
      description: |
        The teams with their member counts, sorted by name. Archived teams
        are included only with `archived=true`. Any signed-in person may read
        it. Not paginated yet.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: archived
          in: query
          required: false
          description: Include archived teams.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTeam
      summary: Create a team
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: The team was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}:
    get:
      operationId: getTeam
      summary: A team
      description: Returns a team, archived or not. Any signed-in person may read it.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateTeam
      summary: Change a team
      description: |
        Changes the given fields; omitted fields stay unchanged. Archived
        teams cannot be changed (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: The changed team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}/archive:
    post:
      operationId: archiveTeam
      summary: Archive a team
      description: |
        Archives a team. It keeps its slug, members and history, becomes
        read-only and no longer appears in team lists (unless asked for) or
        a person's teams. Archiving an archived team changes nothing. A team
        with active child teams cannot be archived (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The archived team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      summary: A team's members
      description: |
        The members of a team, leads first, then by display name. Offboarded
        people are not listed. Archived teams keep their members. Any
        signed-in person may read it.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}/members/{personId}:
    put:
      operationId: setTeamMember
      summary: Add a member or set their role
      description: |
        Adds the person to the team with the given role, or changes the role
        of a member: `lead` makes them a team lead, `member` makes a lead a
        regular member again. A team may have any number of leads. Setting
        the role a member already has changes nothing. Offboarded people
        cannot be added, and archived teams cannot change (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTeamMemberRequest"
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeTeamMember
      summary: Remove a member
      description: |
        Removes the person from the team. Removing someone who is not a
        member changes nothing. Archived teams cannot change (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/profile:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPersonProfile
      summary: A person's profile fields
      description: |
        The person's profile fields as the caller may see them (ADR 0015), by
        section and position: every field the caller may see, with its value
        when set and visible to the caller. The rules are applied by the
        server for every response; clients never filter.

        - Visibility `everyone`: every signed-in person; `team`: people who
          share a team with the person; `admins`: only holders of
          `people.manage`. The person sees their own non-sensitive fields.
        - Sensitive fields are listed only for holders of
          `people.sensitive.read`; every response containing a sensitive
          value is recorded in the audit log.
        - Values the person hid are shown only to them and holders of
          `people.manage`.
        - Non-sensitive birthdays show day and month (`--MM-DD`) to everyone
          except the person and holders of `people.sensitive.read`.

        Offboarded people are not found, except by holders of
        `people.manage`.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updatePersonProfile
      summary: Change a person's profile fields
      description: |
        Sets, clears, hides or shows values of the person's profile fields,
        all or nothing, and returns the profile as `GET` does. Only the
        person and holders of `people.manage` change a profile: the person
        changes fields editable by `self` and hides fields that allow it;
        holders of `people.manage` change every field they can see. Values
        are validated by type (see `ProfileFieldValueChange`). The audit log
        records which fields changed, never the values.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonProfileUpdate"
      responses:
        "200":
          description: The changed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-fields:
    get:
      operationId: listProfileFields
      summary: List profile field definitions
      description: |
        The profile field definitions by section and position. Archived
        fields only with `includeArchived=true`.
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileFieldList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProfileField
      summary: Create a custom profile field
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProfileField"
      responses:
        "201":
          description: The field was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-fields/{fieldId}:
    patch:
      operationId: updateProfileField
      summary: Change a profile field definition
      description: |
        Changes the given settings; the key and type never change, and
        library fields also keep their label and options. Making a field
        sensitive encrypts its existing values (and back). Archiving hides
        the field and its values everywhere; restoring brings them back.
        Removing a select option that is someone's value answers 409.
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileFieldUpdate"
      responses:
        "200":
          description: The changed field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-field-library:
    get:
      operationId: listProfileFieldLibrary
      summary: The library of ready-made profile fields
      description: |
        Ready-made fields (Telegram, phone, birthday, T-shirt size, ...) with
        their default settings and, when turned on before, the field.
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileFieldLibrary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-field-library/{libraryKey}:
    post:
      operationId: enableLibraryProfileField
      summary: Turn on a library field
      description: |
        Creates the field from the library entry with its defaults (201), or
        restores it when it was archived (200). Turn it off by archiving the
        field (`PATCH /api/v1/profile-fields/{fieldId}`).
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: libraryKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The field existed and is turned on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "201":
          description: The field was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/demo:
    get:
      operationId: getDemo
      summary: Demo mode information
      description: |
        Describes the demo dataset and the people one can sign in as with one
        click. Served only in demo mode (`orglane server --demo`); otherwise
        the path does not exist (404). The sign-in screen shows it when the
        discovery document has `demo: true`.
      tags: [demo]
      x-orglane-permission: demo
      responses:
        "200":
          description: The demo dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoInfo"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/demo/sign-in:
    post:
      operationId: signInAsDemoPerson
      summary: One-click sign-in as a demo person
      description: |
        Signs in as a person of the demo dataset without a credential and
        sets the session cookie, like a password sign-in. Without a body (or
        without `username`) it signs in as the dataset's default person, the
        Owner. Served only in demo mode; otherwise the path does not exist
        (404). Attempts are rate limited per client address.
      tags: [demo]
      x-orglane-permission: demo
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-orglane_session
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist (or belongs to someone else).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The request has no valid credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The caller lacks the permission this operation requires, or a
        cookie-authenticated request failed the CSRF checks.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. `about:blank` means the HTTP status says it all.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Forbidden
        status:
          type: integer
          description: The HTTP status code.
          example: 403
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying this occurrence (the request path).
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum: [ok, unavailable]
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: v0.1.0
    Instance:
      type: object
      required: [version, baseDomain, workspaceHost]
      properties:
        version:
          type: string
          example: v0.1.0
        baseDomain:
          type: string
          description: The company base domain.
          example: acme.com
        workspaceHost:
          type: string
          description: The host the workspace is served on.
          example: work.acme.com
    OrglaneDiscovery:
      type: object
      required: [workspaceUrl, apiBaseUrl, issuer, version, demo]
      properties:
        workspaceUrl:
          type: string
          description: The workspace URL.
          example: https://work.acme.com
        apiBaseUrl:
          type: string
          description: The base URL of this API.
          example: https://work.acme.com/api/v1
        issuer:
          type: string
          description: The OpenID Connect issuer (append `/.well-known/openid-configuration` for its metadata).
          example: https://work.acme.com
        version:
          type: string
          example: v0.1.0
        demo:
          type: boolean
          description: |
            True when the instance runs in demo mode: its data is the demo
            dataset and anyone who can reach it may sign in as a demo person
            with one click (`GET /api/v1/demo`, `POST /api/v1/demo/sign-in`).
            Clients should show a clear "demo" marker.
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True while no owner exists and setup can be completed with the setup token.
    SetupRequest:
      type: object
      required: [setupToken, workEmail, username, displayName, password]
      properties:
        setupToken:
          type: string
          description: The one-time setup token from the server log or `orglane cli setup-token`.
        workEmail:
          type: string
          example: alex@acme.com
        username:
          type: string
          example: alex
        displayName:
          type: string
          example: Alex Morgan
        password:
          type: string
          format: password
          minLength: 12
          description: At least 12 characters.
    PasswordSignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: alex@acme.com
        password:
          type: string
          format: password
    PasskeyCeremony:
      type: object
      required: [ceremonyId, publicKey]
      properties:
        ceremonyId:
          type: string
          format: uuid
          description: Identifies the ceremony when finishing it.
        publicKey:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options (PublicKeyCredentialCreationOptions or
            PublicKeyCredentialRequestOptions) with binary values in
            base64url, as accepted by `PublicKeyCredential.parse*OptionsFromJSON`.
    PasskeySignInRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from `navigator.credentials.get`, serialized with `toJSON()`.
    AddPasskeyRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
          description: A name for the passkey, e.g. "MacBook". Defaults to "Passkey".
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from `navigator.credentials.create`, serialized with `toJSON()`.
    PersonSummary:
      type: object
      required: [id, username, workEmail, displayName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        workEmail:
          type: string
        displayName:
          type: string
    SignInResult:
      type: object
      required: [person, csrfToken, passkeyOffer, sessionExpiresAt]
      properties:
        person:
          $ref: "#/components/schemas/PersonSummary"
        csrfToken:
          type: string
          description: Send it in the `X-CSRF-Token` header of state-changing requests.
        passkeyOffer:
          type: boolean
          description: True when the person has no passkey and has not skipped the offer recently; offer to add one, with a "Skip" option.
        sessionExpiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [person, permissions, passkeyOffer]
      properties:
        person:
          $ref: "#/components/schemas/PersonSummary"
        permissions:
          type: array
          items:
            type: string
          description: The permissions the caller holds (ADR 0004).
        passkeyOffer:
          type: boolean
        session:
          $ref: "#/components/schemas/Session"
        csrfToken:
          type: string
          description: Present for browser sessions.
    Device:
      type: object
      required: [id, name, platform]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Firefox on macOS
        platform:
          type: string
          enum: [web, ios, android]
    Session:
      type: object
      required: [id, device, createdAt, lastSeenAt, expiresAt, authMethods, current]
      properties:
        id:
          type: string
          format: uuid
        device:
          $ref: "#/components/schemas/Device"
        createdAt:
          type: string
          format: date-time
          description: When the person signed in.
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The absolute expiry; the session also ends after a period of inactivity.
        authMethods:
          type: array
          items:
            type: string
            enum: [password, passkey, demo]
          description: "`demo` is the one-click sign-in of demo mode (no credential)."
        current:
          type: boolean
          description: True for the session making the request.
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
    Person:
      type: object
      required: [id, username, workEmail, displayName, status, roles]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: maya.okafor
        workEmail:
          type: string
          example: maya.okafor@acme.com
        displayName:
          type: string
          example: Maya Okafor
        title:
          type: string
          description: The job title, if set.
          example: Chief Executive Officer
        status:
          $ref: "#/components/schemas/PersonStatus"
        roles:
          type: array
          items:
            type: string
          description: Keys of the roles the person holds, e.g. `owner`, `admin`, `member` (ADR 0004). The UI translates built-in roles by key.
        avatarUrl:
          type: string
          description: Path of the avatar image (`GET /api/v1/people/{personId}/avatar`), if the person has one.
          example: /api/v1/people/0192b7a0-0000-7000-8000-000000000000/avatar
    PersonStatus:
      type: string
      enum: [invited, active, suspended]
      description: "`invited`: added, has not signed in yet; `active`: can sign in; `suspended`: temporarily blocked. Offboarded people are not listed."
    PersonList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    Team:
      type: object
      required: [id, slug, name, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Identifies the team in URLs and, later, in provider mappings. Unique across all teams, archived ones included.
          example: platform
        name:
          type: string
          example: Platform
        description:
          type: string
          description: What the team does, if set.
          example: Robot software, firmware and the fleet cloud.
        parentId:
          type: string
          format: uuid
          description: The parent team, if any (prepared for the org chart).
        memberCount:
          type: integer
          description: How many people are in the team (offboarded people not counted).
          example: 4
        archivedAt:
          type: string
          format: date-time
          description: When the team was archived. Archived teams are read-only.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
    CreateTeamRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 100
          example: Platform
        slug:
          type: string
          maxLength: 63
          description: 1-63 characters of a-z, 0-9 and `-`, starting and ending with a letter or digit; normalized to lower case.
          example: platform
        description:
          type: string
          maxLength: 1000
        parentId:
          type: string
          format: uuid
          description: The parent team. It must be an active team.
    UpdateTeamRequest:
      type: object
      description: The fields to change; omitted fields stay unchanged.
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 63
        description:
          type: string
          maxLength: 1000
          description: An empty string removes the description.
        parentId:
          type: string
          description: The ID of the new parent team (an active team, not this team or one below it), or an empty string to remove the parent.
    SetTeamMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"
    TeamRole:
      type: string
      enum: [member, lead]
      x-enum-varnames: [TeamRoleMember, TeamRoleLead]
      description: A person's role in a team. A team may have any number of leads, including none.
    TeamMembership:
      type: object
      required: [teamId, personId, role, joinedAt]
      properties:
        teamId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/TeamRole"
        joinedAt:
          type: string
          format: date-time
    TeamMember:
      type: object
      required: [person, role, joinedAt]
      properties:
        person:
          $ref: "#/components/schemas/PersonCard"
        role:
          $ref: "#/components/schemas/TeamRole"
        joinedAt:
          type: string
          format: date-time
    TeamMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
    PersonCard:
      type: object
      description: A person as shown in lists of other things, such as a team's members.
      required: [id, username, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: priya.raman
        displayName:
          type: string
          example: Priya Raman
        title:
          type: string
          example: Senior Robotics Engineer
        status:
          $ref: "#/components/schemas/PersonStatus"
        avatarUrl:
          type: string
          description: Path of the avatar image, if the person has one.
    PersonTeam:
      type: object
      required: [team, role]
      properties:
        team:
          $ref: "#/components/schemas/Team"
        role:
          $ref: "#/components/schemas/TeamRole"
    PersonTeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonTeam"
    ProfileFieldType:
      type: string
      enum: [text, long_text, date, select, phone, url, handle]
      description: |
        How values are validated and stored: `text` (one line, at most 200
        characters), `long_text` (at most 2000 characters), `date`
        (`YYYY-MM-DD`), `select` (an option key), `phone` (E.164, such as
        `+442079460958`), `url` (http or https), `handle` (an account name
        on the service of `handleKind`, without `@`; Mastodon:
        `user@instance`).
    ProfileFieldHandleKind:
      type: string
      enum: [telegram, github, gitlab, x, mastodon]
    ProfileFieldSection:
      type: string
      enum: [contacts, personal, hr, custom]
    ProfileFieldVisibility:
      type: string
      enum: [everyone, team, admins]
      description: |
        Who sees the values besides the person and holders of
        `people.manage`: every signed-in person, people sharing a team with
        the person, or nobody else.
    ProfileFieldEditor:
      type: string
      enum: [self, admins]
      description: "`self`: the person and holders of `people.manage`; `admins`: holders of `people.manage` only."
    ProfileFieldOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: Stored as the value. Derived from the label when omitted on create.
          example: berlin
        label:
          type: string
          maxLength: 100
          example: Berlin
    ProfileField:
      type: object
      required:
        [
          id,
          key,
          library,
          label,
          type,
          options,
          section,
          visibility,
          requiredAtOnboarding,
          editableBy,
          userCanHide,
          sensitive,
          position,
          archived,
        ]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: telegram
        library:
          type: boolean
          description: True for fields from the library. Their key is the library key; clients translate the label by it.
        label:
          type: string
          description: The English label (library fields) or the admin's label (custom fields).
          example: Telegram
        type:
          $ref: "#/components/schemas/ProfileFieldType"
        handleKind:
          $ref: "#/components/schemas/ProfileFieldHandleKind"
        options:
          type: array
          description: The choices of a select field; empty for other types.
          items:
            $ref: "#/components/schemas/ProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        requiredAtOnboarding:
          type: boolean
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
          description: The person may hide their value from everyone except holders of `people.manage`.
        sensitive:
          type: boolean
          description: Values are encrypted at rest, readable only by holders of `people.sensitive.read`, and every read is audited.
        position:
          type: integer
          description: Order within the section, ascending.
        archived:
          type: boolean
    ProfileFieldList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"
    NewProfileField:
      type: object
      required: [label, type]
      properties:
        key:
          type: string
          description: Lower case a-z, 0-9 and `_`, starting with a letter. Derived from the label when omitted. Library keys are reserved.
          example: office
        label:
          type: string
          maxLength: 100
          example: Office
        type:
          $ref: "#/components/schemas/ProfileFieldType"
        handleKind:
          $ref: "#/components/schemas/ProfileFieldHandleKind"
        options:
          type: array
          description: Required for select fields.
          items:
            $ref: "#/components/schemas/NewProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        requiredAtOnboarding:
          type: boolean
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
        sensitive:
          type: boolean
    NewProfileFieldOption:
      type: object
      required: [label]
      properties:
        key:
          type: string
          description: Derived from the label when omitted.
        label:
          type: string
          maxLength: 100
    ProfileFieldUpdate:
      type: object
      description: The settings to change; omitted ones stay. Declassifying sensitive values or changing their select options also requires people.sensitive.read, and reads of existing sensitive values are audited.
      properties:
        label:
          type: string
          maxLength: 100
        options:
          type: array
          description: Replaces the options of a select field. Keep an option's key to keep its values.
          items:
            $ref: "#/components/schemas/NewProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        requiredAtOnboarding:
          type: boolean
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
        sensitive:
          type: boolean
        position:
          type: integer
          minimum: 0
          maximum: 1000000
        archived:
          type: boolean
    ProfileFieldLibraryEntry:
      type: object
      required: [key, label, type, options, section, visibility, editableBy, userCanHide, sensitive]
      properties:
        key:
          type: string
          example: birthday
        label:
          type: string
          description: The English label; clients translate it by key.
          example: Birthday
        type:
          $ref: "#/components/schemas/ProfileFieldType"
        handleKind:
          $ref: "#/components/schemas/ProfileFieldHandleKind"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
        sensitive:
          type: boolean
        field:
          $ref: "#/components/schemas/ProfileField"
    ProfileFieldLibrary:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldLibraryEntry"
    ProfileFieldValue:
      type: object
      required: [field, hidden, yearHidden, editable, hideable]
      properties:
        field:
          $ref: "#/components/schemas/ProfileField"
        value:
          type: string
          description: |
            The value, absent when unset or hidden from the caller. Dates are
            `YYYY-MM-DD`; a birthday without its year is `--MM-DD`. Select
            fields hold an option key.
          example: "--03-14"
        hidden:
          type: boolean
          description: The person hid the value from others (reported only to those who still see it).
        yearHidden:
          type: boolean
          description: The value is a birthday shown without its year.
        editable:
          type: boolean
          description: The caller may set or clear the value.
        hideable:
          type: boolean
          description: The caller (the person) may hide the value.
    PersonProfile:
      type: object
      required: [personId, fields]
      properties:
        personId:
          type: string
          format: uuid
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldValue"
    ProfileFieldValueChange:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The field key.
          example: telegram
        value:
          type: string
          description: |
            The new value; an empty string clears it; omit to leave it.
            Validated by the field type (see `ProfileFieldType`) and stored
            normalized (for example a phone number in E.164, a handle
            without `@`).
          example: maya_okafor
        hidden:
          type: boolean
          description: Hide (true) or show (false) the value; only the person, and hiding only when the field allows it.
    PersonProfileUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ProfileFieldValueChange"
    DemoInfo:
      type: object
      required: [dataset, company, defaultUsername, people]
      properties:
        dataset:
          type: string
          description: The dataset identifier.
          example: acme
        company:
          type: string
          description: The demo company name.
          example: Acme Robotics
        defaultUsername:
          type: string
          description: Who `POST /api/v1/demo/sign-in` signs in as without a username (the Owner).
          example: maya.okafor
        people:
          type: array
          description: The people one can sign in as, in dataset order.
          items:
            $ref: "#/components/schemas/DemoPerson"
    DemoPerson:
      type: object
      required: [username, displayName, role]
      properties:
        username:
          type: string
          example: maya.okafor
        displayName:
          type: string
          example: Maya Okafor
        title:
          type: string
          example: Chief Executive Officer
        role:
          type: string
          description: The key of the person's built-in role (`owner`, `admin` or `member`).
          example: owner
    DemoSignInRequest:
      type: object
      properties:
        username:
          type: string
          description: The demo person to sign in as. Defaults to `defaultUsername` of `GET /api/v1/demo`.
          example: maya.okafor
