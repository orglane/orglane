openapi: 3.0.3
info:
  title: Orglane API
  version: 0.0.0
  description: |
    The unified Orglane API. The web UI, mobile app, modules and agents all use
    this same API (see docs/architecture.md).

    Conventions:
    - Product endpoints live under `/api/v1`. Only the health probes
      (`/healthz`, `/readyz`) and instance discovery (`/.well-known/orglane`)
      live outside the versioned prefix.
    - Every operation declares the permission it requires with the
      `x-orglane-permission` vendor extension (ADR 0004). The value `public`
      marks an operation that needs no authentication; `authenticated` marks
      self-service operations any signed-in caller may use on their own
      account; `demo` marks the operations of demo mode, which need no
      authentication and are served only when the instance runs in demo mode
      (otherwise they do not exist: 404). The server refuses to start, and
      the tests fail, if an operation has no permission.
    - Errors use RFC 9457 problem details (`application/problem+json`).

    Authentication (ADR 0003):
    - Browsers use the session cookie set by the sign-in operations
      (`__Host-orglane_session`; `orglane_session` in the local plain-HTTP
      demo mode). It is host-only, HttpOnly and SameSite=Lax. Every
      state-changing request authenticated with it must come from the
      workspace origin (`Origin` header) and carry the session's CSRF token
      in the `X-CSRF-Token` header (returned by sign-in and `GET /api/v1/me`).
    - Other clients use an OAuth 2.0 access token issued by the embedded
      OpenID Provider: `Authorization: Bearer <token>`.
    - The OpenID Provider endpoints (authorization code flow with PKCE,
      token, userinfo, revocation, introspection, end session, JWKS) are
      standard OpenID Connect and described by the discovery document at
      `/.well-known/openid-configuration`, not by this contract.
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      description: Returns 200 while the process is running. Does not check dependencies.
      tags: [health]
      x-orglane-permission: public
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /readyz:
    get:
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Returns 200 when the instance can serve traffic: the database is
        reachable and all migrations are applied. Returns 503 otherwise.
        Check details are logged by the server, not returned.
      tags: [health]
      x-orglane-permission: public
      responses:
        "200":
          description: The instance is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The instance is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/v1/me/onboarding:
    get:
      operationId: getMyOnboarding
      summary: My current onboarding checklist
      description: Completion is derived from current data and authorized profile fields; values are never returned.
      tags: [onboarding]
      x-orglane-permission: authenticated
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Current checklist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/onboarding/finish:
    post:
      operationId: finishMyOnboarding
      summary: Finish welcome, leaving optional steps for later
      description: Idempotent; rejects incomplete required steps the person can actually perform. Does not mark optional steps complete.
      tags: [onboarding]
      x-orglane-permission: authenticated
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      responses:
        "204":
          description: Welcome finished.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/onboarding:
    get:
      operationId: getPersonOnboarding
      summary: View onboarding progress for one person
      description: Requires people.manage. Profile progress includes only fields visible to this caller; sensitive completion is scoped and audited like profile reads. Never returns field names or values.
      tags: [onboarding]
      x-orglane-permission: people.manage
      security: [{ sessionCookie: [] }, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Caller-visible progress, which may differ from the person's own view.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingProgress"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/version:
    get:
      operationId: getVersion
      summary: Server version
      tags: [meta]
      x-orglane-permission: public
      responses:
        "200":
          description: The server version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Version"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Instance information
      description: Returns how this instance is addressed (ADR 0018).
      tags: [instance]
      x-orglane-permission: instance.read
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Instance information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /.well-known/orglane:
    get:
      operationId: getOrglaneDiscovery
      summary: Instance discovery
      description: |
        How clients (the mobile app, ADR 0012) find this instance's
        workspace, API and OpenID Provider from a work email domain
        (ADR 0018). Contains nothing sensitive.
      tags: [meta]
      x-orglane-permission: public
      responses:
        "200":
          description: The discovery document.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrglaneDiscovery"
  /api/v1/auth/setup:
    get:
      operationId: getSetupStatus
      summary: First-run setup status
      description: Reports whether the instance still needs its first owner.
      tags: [auth]
      x-orglane-permission: public
      responses:
        "200":
          description: The setup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupStatus"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: completeSetup
      summary: Create the first owner
      description: |
        Creates the first owner with a password and signs them in. Requires
        the one-time setup token printed in the server log on first start
        (or generated with `orglane cli setup-token`). Possible only while no
        owner exists. Sets the session cookie.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetupRequest"
      responses:
        "201":
          description: The owner was created and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/sign-in:
    post:
      operationId: signInWithPassword
      summary: Sign in with a password
      description: |
        Signs in with a work email and password and sets the session cookie.
        Failures are rate limited per client address and per account; a
        locked account answers 429 even for the right password.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/passkey/options:
    post:
      operationId: beginPasskeySignIn
      summary: Start a passkey sign-in
      description: |
        Returns WebAuthn request options for `navigator.credentials.get`
        (discoverable credentials, no username needed) and the ceremony ID to
        finish with. The ceremony expires after 5 minutes and can be used
        once.
      tags: [auth]
      x-orglane-permission: public
      responses:
        "200":
          description: The WebAuthn options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/passkey:
    post:
      operationId: signInWithPasskey
      summary: Sign in with a passkey
      description: Verifies the WebAuthn assertion and sets the session cookie.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasskeySignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out
      description: Revokes the current browser session and clears the session cookie.
      tags: [auth]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Signed out.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me:
    get:
      operationId: getMe
      summary: The signed-in person
      description: |
        Returns the caller, their permissions and, for browser sessions, the
        session, its CSRF token and whether to offer adding a passkey.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/sessions:
    get:
      operationId: listMySessions
      summary: List my sessions
      description: The caller's valid sessions, oldest first.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The sessions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/sessions/{sessionId}:
    delete:
      operationId: revokeMySession
      summary: Revoke one of my sessions
      description: Revokes the session immediately; its next request is unauthenticated.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkeys:
    get:
      operationId: listMyPasskeys
      summary: List my passkeys
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The passkeys.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: addMyPasskey
      summary: Add a passkey
      description: Verifies the WebAuthn attestation from `navigator.credentials.create` and stores the passkey.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPasskeyRequest"
      responses:
        "201":
          description: The passkey was added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Passkey"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkeys/options:
    post:
      operationId: beginPasskeyRegistration
      summary: Start adding a passkey
      description: |
        Returns WebAuthn creation options for `navigator.credentials.create`
        and the ceremony ID to finish with (`POST /api/v1/me/passkeys`).
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The WebAuthn options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeyCeremony"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkeys/{passkeyId}:
    delete:
      operationId: removeMyPasskey
      summary: Remove a passkey
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      parameters:
        - name: passkeyId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/passkey-offer/dismiss:
    post:
      operationId: dismissPasskeyOffer
      summary: Skip the passkey offer
      description: Remembers that the caller skipped adding a passkey; the offer returns after 30 days.
      tags: [me]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Dismissed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people:
    get:
      operationId: listPeople
      summary: List people
      description: |
        Public base fields only; custom/sensitive profile fields are never searched
        or included. Results are in stable UUID (creation) order, using keyset
        pagination. Each response has a private, content-based ETag.
        updated_since is inclusive and includes offboarded tombstones (id/status/updatedAt
        only; required string/array fields are empty). It cannot
        combine with search/team/role filters: revalidate filtered lists in full
        to detect removals. Pages reflect current state, not a frozen snapshot;
        cache consumers merge by ID, overlap incremental windows, and periodically
        revalidate all pages. Authentication and permissions are checked before 304.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Case-insensitive literal substring of name, username, work email or title.
          schema: { type: string, maxLength: 200 }
        - name: team
          in: query
          description: An active team ID (direct membership).
          schema: { type: string, format: uuid }
        - name: role
          in: query
          description: Role key.
          schema: { type: string, maxLength: 63 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: nextCursor from the previous page, with the same filters.
          schema: { type: string, format: uuid }
        - name: updated_since
          in: query
          description: Inclusive lower bound on public directory changes; includes offboarded tombstones.
          schema: { type: string, format: date-time }
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        "200":
          description: The people.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonList"
        "304":
          description: The authenticated caller's page is unchanged.
          headers:
            ETag:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}:
    get:
      operationId: getPerson
      summary: Public directory details of a person
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: Public base fields; custom values use the profile endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updatePerson
      summary: Edit public base profile fields
      description: Self may edit displayName/title; people.manage may also edit username/workEmail/managerId. Empty managerId removes the manager. Teams and custom fields use their own endpoints.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated public profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/avatar:
    get:
      operationId: getPersonAvatar
      summary: A person's avatar image
      description: |
        Returns the avatar image with its stored content type. Responses
        carry `X-Content-Type-Options: nosniff` and a sandboxing
        `Content-Security-Policy`, so an image opened directly cannot run
        scripts or load anything.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: personId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The avatar image.
          content:
            image/svg+xml:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: uploadPersonAvatar
      summary: Upload a raster avatar for self or with people.manage
      description: Raw PNG/JPEG/WebP only, at most 5 MiB and 16 megapixels; decoded, proportionally resized to at most 512px, and re-encoded as a metadata-free PNG fitting 256 KiB. SVG uploads are rejected.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          image/*:
            schema: { type: string, format: binary }
            examples:
              raster:
                summary: Content-Type must be image/png, image/jpeg or image/webp.
      responses:
        "204":
          description: Avatar stored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Upload exceeds 5 MiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "415":
          description: Unsupported avatar content type.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/teams:
    get:
      operationId: listPersonTeams
      summary: A person's teams
      description: |
        The teams a person belongs to, with their role in each, sorted by
        name. Archived teams are not included. Any signed-in person may read
        it.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: The person's teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonTeamList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams:
    get:
      operationId: listTeams
      summary: List teams
      description: |
        The teams with their member counts, sorted by name. Archived teams
        are included only with `archived=true`. Any signed-in person may read
        it. Not paginated yet.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: archived
          in: query
          required: false
          description: Include archived teams.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The teams.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTeam
      summary: Create a team
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeamRequest"
      responses:
        "201":
          description: The team was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}:
    get:
      operationId: getTeam
      summary: A team
      description: Returns a team, archived or not. Any signed-in person may read it.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
