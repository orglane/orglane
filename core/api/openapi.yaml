                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateTeam
      summary: Change a team
      description: |
        Changes the given fields; omitted fields stay unchanged. Archived
        teams cannot be changed (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTeamRequest"
      responses:
        "200":
          description: The changed team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}/archive:
    post:
      operationId: archiveTeam
      summary: Archive a team
      description: |
        Archives a team. It keeps its slug, members and history, becomes
        read-only and no longer appears in team lists (unless asked for) or
        a person's teams. Archiving an archived team changes nothing. A team
        with active child teams cannot be archived (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The archived team.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}/members:
    get:
      operationId: listTeamMembers
      summary: A team's members
      description: |
        The members of a team, leads first, then by display name. Offboarded
        people are not listed. Archived teams keep their members. Any
        signed-in person may read it.
      tags: [teams]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
      responses:
        "200":
          description: The members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMemberList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/teams/{teamId}/members/{personId}:
    put:
      operationId: setTeamMember
      summary: Add a member or set their role
      description: |
        Adds the person to the team with the given role, or changes the role
        of a member: `lead` makes them a team lead, `member` makes a lead a
        regular member again. A team may have any number of leads. Setting
        the role a member already has changes nothing. Offboarded people
        cannot be added, and archived teams cannot change (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/PersonId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetTeamMemberRequest"
      responses:
        "200":
          description: The membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeTeamMember
      summary: Remove a member
      description: |
        Removes the person from the team. Removing someone who is not a
        member changes nothing. Archived teams cannot change (409).
      tags: [teams]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TeamId"
        - $ref: "#/components/parameters/PersonId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/profile:
    parameters:
      - name: personId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPersonProfile
      summary: A person's profile fields
      description: |
        The person's profile fields as the caller may see them (ADR 0015), by
        section and position: every field the caller may see, with its value
        when set and visible to the caller. The rules are applied by the
        server for every response; clients never filter.

        - Visibility `everyone`: every signed-in person; `team`: people who
          share a team with the person; `admins`: only holders of
          `people.manage`. The person sees their own non-sensitive fields.
        - Sensitive fields are listed only for holders of
          `people.sensitive.read`; every response containing a sensitive
          value is recorded in the audit log.
        - Values the person hid are shown only to them and holders of
          `people.manage`.
        - Non-sensitive birthdays show day and month (`--MM-DD`) to everyone
          except the person and holders of `people.sensitive.read`.

        Offboarded people are not found, except by holders of
        `people.manage`.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updatePersonProfile
      summary: Change a person's profile fields
      description: |
        Sets, clears, hides or shows values of the person's profile fields,
        all or nothing, and returns the profile as `GET` does. Only the
        person and holders of `people.manage` change a profile: the person
        changes fields editable by `self` and hides fields that allow it;
        holders of `people.manage` change every field they can see. Values
        are validated by type (see `ProfileFieldValueChange`). The audit log
        records which fields changed, never the values.
      tags: [people]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonProfileUpdate"
      responses:
        "200":
          description: The changed profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-fields:
    get:
      operationId: listProfileFields
      summary: List profile field definitions
      description: |
        The profile field definitions by section and position. Archived
        fields only with `includeArchived=true`.
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: includeArchived
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileFieldList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createProfileField
      summary: Create a custom profile field
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProfileField"
      responses:
        "201":
          description: The field was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-fields/{fieldId}:
    patch:
      operationId: updateProfileField
      summary: Change a profile field definition
      description: |
        Changes the given settings; the key and type never change, and
        library fields also keep their label and options. Making a field
        sensitive encrypts its existing values (and back). Archiving hides
        the field and its values everywhere; restoring brings them back.
        Removing a select option that is someone's value answers 409.
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: fieldId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileFieldUpdate"
      responses:
        "200":
          description: The changed field.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-field-library:
    get:
      operationId: listProfileFieldLibrary
      summary: The library of ready-made profile fields
      description: |
        Ready-made fields (Telegram, phone, birthday, T-shirt size, ...) with
        their default settings and, when turned on before, the field.
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The library.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileFieldLibrary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/profile-field-library/{libraryKey}:
    post:
      operationId: enableLibraryProfileField
      summary: Turn on a library field
      description: |
        Creates the field from the library entry with its defaults (201), or
        restores it when it was archived (200). Turn it off by archiving the
        field (`PATCH /api/v1/profile-fields/{fieldId}`).
      tags: [profile-fields]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: libraryKey
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The field existed and is turned on.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "201":
          description: The field was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileField"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/demo:
    get:
      operationId: getDemo
      summary: Demo mode information
      description: |
        Describes the demo dataset and the people one can sign in as with one
        click. Served only in demo mode (`orglane server --demo`); otherwise
        the path does not exist (404). The sign-in screen shows it when the
        discovery document has `demo: true`.
      tags: [demo]
      x-orglane-permission: demo
      responses:
        "200":
          description: The demo dataset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoInfo"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/demo/sign-in:
    post:
      operationId: signInAsDemoPerson
      summary: One-click sign-in as a demo person
      description: |
        Signs in as a person of the demo dataset without a credential and
        sets the session cookie, like a password sign-in. Without a body (or
        without `username`) it signs in as the dataset's default person, the
        Owner. Served only in demo mode; otherwise the path does not exist
        (404). Attempts are rate limited per client address.
      tags: [demo]
      x-orglane-permission: demo
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSignInRequest"
      responses:
        "200":
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/invitation:
    post:
      operationId: previewInvitation
      summary: Look up an invitation
      description: |
        Returns who an invitation link is for, so the accept page can greet
        the person before they choose a password. The token is the fragment
        of the invitation link (`/invite#<token>`); it is sent in the body,
        never in a URL. Attempts are rate limited per client address.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvitationTokenRequest"
      responses:
        "200":
          description: The invitation is valid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/auth/invitation/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        Sets the invited person's password, makes them active and signs them
        in (sets the session cookie, like a password sign-in). The token can
        be used once: afterwards it answers 409. An unknown, revoked or
        replaced token answers 404 and an expired one 410. Attempts are rate
        limited per client address.
      tags: [auth]
      x-orglane-permission: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "200":
          description: Accepted and signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          $ref: "#/components/responses/Gone"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invitations:
    get:
      operationId: listInvitations
      summary: List open invitations
      description: |
        Invitations of people who are still invited, newest first, with how
        each was delivered and, for email, its delivery state: a failing
        SMTP server shows up here as `retrying` and then `failed`, with the
        error.
      tags: [invitations]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The invitations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createInvitation
      summary: Invite a person
      description: |
        Adds the person to the directory as `invited`, with the role, and
        issues a single-use invitation link that expires
        (`identity.invitation_lifetime`, 7 days by default). With system
        email configured the link is emailed to the contact email in the
        background when the channel is trusted for that permission grant;
        otherwise it is returned as `link` for the admin to share. Editable
        SMTP can carry only permissions guaranteed to every SMTP editor
        (`instance.manage`); additional grants require a copy-link. Immutable
        server-configured SMTP can carry all grants. Granting a role requires
        holding every permission in it.
        The language of the email follows `Accept-Language`.
      tags: [invitations]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: The person was invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invitations/options:
    get:
      operationId: getInvitationOptions
      summary: How new invitations are made
      description: How a new invitation would be delivered right now, the default work email pattern and the link lifetime.
      tags: [invitations]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The options.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitationOptions"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invitations/{invitationId}/resend:
    post:
      operationId: resendInvitation
      summary: Resend an invitation
      description: |
        Issues a new link with a new expiry and sends it like a new
        invitation (or returns it as `link`). The previous link stops
        working; a revoked invitation becomes valid again.
      tags: [invitations]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "200":
          description: The invitation was reissued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IssuedInvitation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/invitations/{invitationId}:
    delete:
      operationId: revokeInvitation
      summary: Revoke an invitation
      description: |
        The link stops working at once and a queued email is canceled. The
        person stays in the directory as invited; resending issues a new
        link.
      tags: [invitations]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/settings/email:
    get:
      operationId: getEmailSettings
      summary: System email settings
      description: |
        The SMTP server used for system email (ADR 0014). `source` is
        `config` when the server configuration sets it (`email.smtp.*`):
        then it cannot be changed here. The password is never returned.
      tags: [settings]
      x-orglane-permission: instance.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      operationId: putEmailSettings
      summary: Save the system email settings
      description: |
        Saves the SMTP server. The password is stored encrypted with a key
        derived from the instance master secret; omit it to keep the saved
        one. Credentials are only ever sent over TLS (or to localhost).
      tags: [settings]
      x-orglane-permission: instance.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailSettingsInput"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteEmailSettings
      summary: Remove the system email settings
      description: Without email, invitations produce links to share.
      tags: [settings]
      x-orglane-permission: instance.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/settings/email/test:
    post:
      operationId: sendTestEmail
      summary: Send a test email
      description: |
        Queues a test email in the outbox and waits for its first delivery
        result. An SMTP failure answers 502 with a bounded safe error
        category in `detail`; the worker continues its configured retries.
      tags: [settings]
      x-orglane-permission: instance.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestEmailRequest"
      responses:
        "204":
          description: The SMTP server accepted the message.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v1/people-imports/template:
    get:
      operationId: getPeopleImportTemplate
      summary: Download a CSV import template
      tags: [people-imports]
      x-orglane-permission: people.manage
      responses:
        "200":
          description: UTF-8 CSV template. Teams are separated by semicolons.
          content:
            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people-imports:
    post:
      operationId: uploadPeopleImport
      summary: Upload CSV or XLSX into encrypted staging
      description: |
        Maximum 5 MiB, 1000 data rows, 100 columns, 4096 bytes per cell.
        XLSX expands to at most 32 MiB and 100 ZIP entries; formulas are rejected
        per row and never evaluated. UTF-8, BOM-marked UTF-16 and Windows-1252
        CSV are detected. Only the first XLSX sheet is imported.
        Runs belong to their uploader; source values never appear in responses.
        Unapplied runs are deleted 24 hours after upload (see expiresAt).
      tags: [people-imports]
      x-orglane-permission: people.manage
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Staged import, with column headers and detection metadata.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleImport" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people-imports/github:
    post:
      operationId: fetchGitHubPeopleImport
      summary: Fetch GitHub organization members into encrypted import staging
      description: |
        Short-lived fine-grained PAT with organization Members read permission.
        Token is used synchronously and never persisted. Maximum 2000 members;
        incomplete fetches fail without creating a run. Public email is optional
        and is not identity proof. Existing required-field rules still apply.
      tags: [people-imports]
      x-orglane-permission: people.manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization, token]
              properties:
                organization: { type: string, minLength: 1, maxLength: 39 }
                token: { type: string, minLength: 1, maxLength: 255, writeOnly: true }
      responses:
        "201":
          description: Complete source staged; token discarded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleImport" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people-imports/{runId}:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getPeopleImport
      summary: Read an import and its persisted decisions and results
      tags: [people-imports]
      x-orglane-permission: people.manage
      responses:
        "200":
          description: Import metadata and value-free row decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleImport" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deletePeopleImport
      summary: Delete an import and everything stored for it
      description: |
        Any holder of people.manage may delete any run, including its uploader.
        Removes staged source material, decisions, results and the error export
        at once; people and changes made by an applied run are not undone.
        Source-scoped identity matches for reimport are kept. Deleting a run
        that does not exist (or no longer exists) also succeeds.
      tags: [people-imports]
      x-orglane-permission: people.manage
      responses:
        "204":
          description: Deleted, or already gone.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people-imports/{runId}/preview:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: previewPeopleImport
      summary: Map columns and persist a preview before applying
      description: |
        Mapping JSON is limited to 64 KiB and rejects unknown fields and trailing data.
        Targets are username, work_email, contact_email, display_name, title,
        manager_email, teams, role, external_id, and profile.<enabled field key>.
        Empty cells leave existing values unchanged. Role assigns an additional
        bundle and requires every target and requested permission; it never
        replaces existing roles. Unknown teams require createTeams. Matching
        prioritizes work email, contact email, external ID; disagreeing identities
        and duplicate input identifiers are conflicts. Preview must be repeated
        after a stale-row conflict. Skipped row numbers are explicit decisions.
      tags: [people-imports]
      x-orglane-permission: people.manage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PeopleImportMapping" }
      responses:
        "200":
          description: Persisted create, update, skip or conflict decisions.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleImport" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people-imports/{runId}/apply:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: applyPeopleImport
      summary: Apply a persisted preview with isolated row transactions
      description: |
        Current permissions, identities, definitions and preview versions are
        revalidated. Failed rows roll back while other rows continue. Apply
        erases the staged source material in the same transaction; repeating
        apply returns the stored, value-free result until the run expires. Invitations use the existing secure
        channel and grant ceilings; links and tokens are never staged/exported.
        Optional email delivery fails the row if the grant requires a link.
      tags: [people-imports]
      x-orglane-permission: people.manage
      responses:
        "200":
          description: Applied import results.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PeopleImport" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people-imports/{runId}/errors:
    parameters:
      - { name: runId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: exportPeopleImportErrors
      summary: Download value-free row errors as safe CSV
      tags: [people-imports]
      x-orglane-permission: people.manage
      responses:
        "200":
          description: Row numbers, decisions and fixed error codes only.
          content:
            text/csv:
              schema: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/providers:
    get:
      operationId: listAppProviders
      summary: Compiled providers
      description: |
        The provider adapters compiled into this server, with their
        capability matrix (every feature, including unsupported and planned
        ones), credentials (names only), settings schema and employee steps.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The providers, by ID.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppProviderList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances:
    get:
      operationId: listAppInstances
      summary: App instances
      description: Every app instance with its state, health and version, oldest first. Removed instances are included.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The app instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: installAppInstance
      summary: Install a managed provider
      description: |
        Installs a managed provider (Forgejo) through the agent: creates the
        instance (`installing`) with its credentials and desired state, and
        queues the push. The agent's operation shows in the instance's
        operations; when it succeeds, Setup runs and activates the instance.

        Before anything is stored the install is checked: the key (pattern;
        `key_reserved` while another instance or retained data holds it), the
        host (a host name other than the workspace host, not used by another
        instance: `host_taken`; in local mode under `.localhost`:
        `host_not_local`, with a workspace under `.localhost`:
        `localhost_workspace`), the agent (connected, same version:
        `agent_unavailable`, `agent_version_mismatch`, `agent_untrusted`),
        the host's resources against the package's minimums
        (`insufficient_memory`, `insufficient_disk`) and, in domain mode, the
        host's DNS records (`dns_unresolved`, `dns_mismatch`,
        `dns_lookup_failed`). Refusals are 409 with that code; invalid input is
        400 with the field. Settings the request leaves out get the
        provider's defaults (`AppProvider.install.settings`).
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstallAppInstanceRequest"
      responses:
        "202":
          description: The instance, installing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/agent:
    get:
      operationId: getAppAgent
      summary: The agent of managed services
      description: |
        Whether managed services are configured and the agent is connected
        with this server's version, and the host's resources it reports, so
        Settings → Apps can offer installs or show how to enable managed
        services.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The agent's status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAgentStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}:
    get:
      operationId: getAppInstance
      summary: An app instance
      description: |
        State, settings, bindings, the last operations, credential versions
        (names, versions and states, never values), the unmanaged account
        count and provisioning result counts.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: The app instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstanceDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateAppInstance
      summary: Change an app instance
      description: |
        Changes the display name, the access policy, whether existing
        provider members are managed (removable) and provider settings.
        Omitted fields stay unchanged; a `null` setting removes it.
        Immutable settings cannot change (400). Removed instances cannot
        change (409). Changes that affect access queue provisioning.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppInstanceRequest"
      responses:
        "200":
          description: The changed app instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeAppInstance
      summary: Remove a managed instance
      description: |
        Stops and removes the services of an active, degraded or failed
        managed instance (`removing`, then `removed`). Without `purge` its
        data, database and credentials are retained and the key stays
        reserved, so it can be reinstalled. With `purge=true` they are deleted
        and the key is freed; this needs `confirm` set to the instance key
        (400 otherwise) and is also allowed on a removed instance whose data
        is retained. Other states are refused (409, `invalid_state`); a
        failed removal leaves the instance `failed` with `remove_failed`.
        Connected instances are not removed here (409, `not_supported`).
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: purge
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: confirm
          in: query
          required: false
          description: The instance key, required with `purge=true`.
          schema:
            type: string
            maxLength: 64
      responses:
        "202":
          description: The instance, removing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/reinstall:
    post:
      operationId: reinstallAppInstance
      summary: Reinstall a removed managed instance
      description: |
        Brings back a removed managed instance whose data is retained: the
        same ID, key, credentials and data, installed again with the version
        it ran. Other states are refused (409, `invalid_state`).
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: The instance, installing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/operations:
    get:
      operationId: listAppInstanceOperations
      summary: Operation history of a managed instance
      description: |
        The agent operations of a managed instance, newest first: install,
        configuration changes, re-pushes after the agent lost its state,
        upgrades and rollbacks. An unfinished operation whose `errorCode`
        is `agent_unavailable`, `agent_version_mismatch` or
        `agent_untrusted` waits for the agent and is retried with backoff.
        Connected instances have none.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 1000000
            default: 0
      responses:
        "200":
          description: A page of operations.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppOperationList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/setup:
    post:
      operationId: retryAppInstanceSetup
      summary: Retry the setup of a managed instance
      description: |
        Retries `Lifecycle.Setup` of a managed instance that is `failed`
        with `setup_failed`: it goes back to `installing` and the setup job
        runs again. Other states are refused (409, `invalid_state`).
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "202":
          description: Setup was queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppInstance"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/open:
    get:
      operationId: openAppInstance
      summary: Deep link into an app
      description: |
        The URL that opens `to` in the app instance, signed in through
        Orglane where the provider supports it (Forgejo: Forgejo's sign-in
        with Orglane, then the target, without a second sign-in). Clients
        open it in a new tab or the external browser. `to` is a relative
        path (with query and fragment): 1-2048 bytes, starting with one
        `/`, without backslashes, spaces or control characters; anything
        else is refused (400, `invalid_input`). The caller must be an active
        person and the instance `active` or `degraded` (409,
        `invalid_state`); instances whose provider has no deep links are
        not found (404).
      tags: [apps]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: to
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        "200":
          description: The deep link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppDeepLink"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/credentials/{credentialName}/rotate:
    post:
      operationId: rotateAppCredential
      summary: Rotate a credential
      description: |
        Starts a staged rotation of a rotatable credential: the new version
        is stored as `pending` and handed to the provider by a job. The
        active version stays in use until the provider acknowledges the new
        one; a definite rejection discards it, an unknown answer keeps it
        `uncertain` and retries. At most one rotation per credential runs
        (409, `rotation_in_progress`). Credentials the agent consumes rotate
        with the managed service and are refused (409, `not_supported`).
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CredentialName"
      responses:
        "202":
          description: The rotation started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppCredentialRotation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/github/connect:
    post:
      operationId: beginGitHubConnect
      summary: Connect a GitHub organization through an App manifest or manual setup
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization, key]
              properties:
                organization: { type: string, minLength: 1, maxLength: 39 }
                key: { type: string, minLength: 2, maxLength: 24 }
                instanceId:
                  {
                    type: string,
                    format: uuid,
                    description: Resume installation of this connecting instance; organization and key must match.,
                  }
                manual:
                  type: object
                  additionalProperties: false
                  required: [appId, clientId, privateKey, clientSecret, webhookSecret]
                  properties:
                    appId: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
                    clientId: { type: string, minLength: 1, maxLength: 100 }
                    privateKey: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
                    clientSecret: { type: string, minLength: 1, maxLength: 1000, writeOnly: true }
                    webhookSecret: { type: string, minLength: 32, maxLength: 1000, writeOnly: true }
      responses:
        "200":
          description: The next browser step; credentials are never returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubConnectStep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/apps/github/connect/complete:
    post:
      operationId: completeGitHubConnect
      summary: Consume one session-bound GitHub connection callback
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state]
              properties:
                state: { type: string, minLength: 1, maxLength: 100 }
                code: { type: string, minLength: 1, maxLength: 256 }
                installationId: { type: string, pattern: "^[1-9][0-9]{0,18}$" }
      responses:
        "200":
          description: Next installation redirect or completed connection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GitHubConnectStep" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/apps/instances/{instanceId}/credentials/{credentialName}:
    parameters:
      - { $ref: "#/components/parameters/InstanceId" }
      - { $ref: "#/components/parameters/CredentialName" }
    put:
      operationId: uploadAppCredential
      summary: Stage and verify a replacement GitHub App private key
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [value]
              properties:
                value: { type: string, minLength: 1, maxLength: 16384, writeOnly: true }
      responses:
        "202": { description: Replacement staged; active key remains until verified. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/apps/instances/{instanceId}/credentials/{credentialName}/abandon:
    post:
      operationId: abandonAppCredentialRotation
      summary: Abandon a rotation
      description: |
        Gives up the pending or uncertain version of a credential. A job
        first re-applies the active value to the provider until it is
        acknowledged, and only then discards the candidate. Without a
        rotation in progress: 409, `no_rotation`.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CredentialName"
      responses:
        "202":
          description: Abandoning was queued.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/credentials/{credentialName}/resolve:
    post:
      operationId: resolveAppCredentialRotation
      summary: Force the outcome of an uncertain rotation
      description: |
        Records, without evidence from the provider, which value it uses:
        `active` makes the uncertain or cancelling version the active one,
        `discarded` drops it and keeps the current value. Only for a rotation
        whose outcome cannot be established otherwise (rotate retries, proof
        by use, cancelling): a wrong choice breaks the provider's use of the
        credential until it is rotated again. Audited, and shown as an
        admin's resolution, never as verified. 409 `no_rotation` without a
        rotation; 409 `rotation_in_progress` while a provider call may still
        be running; 409 `invalid_state` for a version never handed to the
        provider (cancel it instead); 409 `candidate_value_unknown` for
        `active` when the provider minted the new value and the answer
        carrying it was lost (only `discarded` is possible).
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/CredentialName"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [resolution]
              properties:
                resolution: { type: string, enum: [active, discarded] }
      responses:
        "204": { description: The rotation was resolved. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/apps/bindings:
    get:
      operationId: listAppBindings
      summary: Capability bindings
      description: Capability → app instance bindings, at most one default per capability.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The bindings, by capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBindingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/bindings/{capability}:
    put:
      operationId: setDefaultAppBinding
      summary: Set the default instance of a capability
      description: The instance must already be bound to the capability (it is once it is active); otherwise 404.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - name: capability
          in: path
          required: true
          schema:
            type: string
            pattern: "^[a-z][a-z0-9_.]{0,40}$"
            example: code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultAppBindingRequest"
      responses:
        "200":
          description: The bindings of the capability.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppBindingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/team-mappings:
    get:
      operationId: listAppTeamMappings
      summary: Team mappings
      description: The Orglane teams mapped to provider teams of the instance, with the provider team names.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: The mappings, by team name.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTeamMappingList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/team-mappings/{teamId}:
    put:
      operationId: setAppTeamMapping
      summary: Create or change a team mapping
      description: |
        `create`: Orglane creates a provider team named after the team's
        slug. `existing`: maps to the provider team `externalRef`. Archived
        teams cannot be mapped (400). Queues provisioning for the instance.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/TeamId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAppTeamMappingRequest"
      responses:
        "200":
          description: The mapping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppTeamMapping"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: removeAppTeamMapping
      summary: Remove a team mapping
      description: Members lose what the mapping granted, through the removal guard.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - $ref: "#/components/parameters/TeamId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/provisioning:
    get:
      operationId: getAppProvisioning
      summary: Provisioning status
      description: |
        A page of provisioning results (by display name), the unmanaged
        accounts report and the held removal batch, if any.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: The provisioning status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppProvisioning"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/provisioning/plan:
    post:
      operationId: planAppProvisioning
      summary: Dry run
      description: |
        Plans every person the instance concerns (at most 1000) without
        changing anything: no provider state, results or jobs. Removals of
        accounts Orglane does not manage are never planned.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      responses:
        "200":
          description: The planned actions per person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppProvisioningPlan"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/provisioning/retry:
    post:
      operationId: retryAppProvisioning
      summary: Retry failed results
      description: Queues provisioning again for every failed result of the instance, or for one person's.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetryAppProvisioningRequest"
      responses:
        "202":
          description: The retries were queued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppProvisioningRetry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/apps/instances/{instanceId}/provisioning/removal-batches/{batchId}/confirm:
    post:
      operationId: confirmAppRemovalBatch
      summary: Release a held removal batch
      description: |
        Confirms the held batch with the `itemsHash` the admin saw. A batch
        that is no longer held or whose items changed is refused (409,
        `batch_changed`). Each item is re-checked before it is applied: an
        item whose person's desired access changed since the preview is
        dropped, never applied.
      tags: [apps]
      x-orglane-permission: apps.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmAppRemovalBatchRequest"
      responses:
        "202":
          description: The removals were released and queued.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/people/{personId}/apps:
    get:
      operationId: getPersonApps
      summary: A person's app access and links
      description: |
        The person's provisioning results in every app instance, their
        verified account links and their unverified import evidence
        (`pending`, which never grants access).
      tags: [apps]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
      responses:
        "200":
          description: The person's app access.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonApps"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/apps:
    get:
      operationId: listMyApps
      summary: My apps
      description: The active app instances the caller has access to, with their home URLs and the state of the caller's access.
      tags: [apps]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller's apps.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyAppList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/me/account-links:
    get:
      operationId: listMyAccountLinks
      summary: My account links
      description: |
        The caller's verified provider account links, their import evidence
        (`pending`, which proves nothing) for organizations with an active
        instance, and the providers where they can link an account.
      tags: [apps]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      responses:
        "200":
          description: The caller's links.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyAccountLinks" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/me/account-links/{provider}/start:
    post:
      operationId: startAccountLink
      summary: Begin verifying my account at a provider
      description: |
        Returns the provider URL to send the browser to. The state and PKCE
        verifier are bound to the caller and this browser session, are
        single-use and expire after ten minutes. Only from a browser
        session. 409 `not_supported` when no active instance of the provider
        verifies accounts.
      tags: [apps]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                instanceId:
                  type: string
                  format: uuid
                  description: The instance whose provider App to authorize through; defaults to the oldest active one.
      responses:
        "200":
          description: Where to send the browser.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/me/account-links/{provider}/complete:
    post:
      operationId: completeAccountLink
      summary: Finish verifying my account at a provider
      description: |
        Called by the SPA callback route with the provider's `state` and
        `code`. The state is consumed first and only by the caller's own
        session, also when the exchange fails. The link is keyed by the
        provider's immutable account ID; the provider token is used once
        and revoked. 409 `invalid_state` for an unknown, used, expired or
        foreign state; 409 `account_already_linked` when the account is
        linked to another person (an admin must revoke that link first);
        400 with the provider's safe code when the provider refuses; 429
        with `Retry-After` on a provider rate limit.
      tags: [apps]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
      parameters:
        - $ref: "#/components/parameters/ProviderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [state, code]
              properties:
                state: { type: string, minLength: 1, maxLength: 100 }
                code: { type: string, minLength: 1, maxLength: 256 }
      responses:
        "200":
          description: The verified link.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountLinkView" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/me/account-links/{linkId}:
    delete:
      operationId: unlinkMyAccount
      summary: Unlink one of my accounts
      description: |
        Revokes the caller's own verified link. The provider account is no
        longer managed for them (reported, not removed).
      tags: [apps]
      x-orglane-permission: authenticated
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "204": { description: The link was revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/people/{personId}/account-links/{linkId}:
    delete:
      operationId: revokePersonAccountLink
      summary: Revoke a person's account link
      description: |
        Revokes a wrong verified link of a person. Admins can revoke links,
        never create them; only the person's own verification does.
      tags: [apps]
      x-orglane-permission: people.manage
      security:
        - sessionCookie: []
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PersonId"
        - $ref: "#/components/parameters/LinkId"
      responses:
        "204": { description: The link was revoked. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /api/v1/webhooks/{instanceId}:
    post:
      operationId: receiveWebhook
      summary: Provider webhooks
      description: |
        Webhook deliveries from providers. The provider's signature over
        the exact raw body is the authentication; the body is opaque here
        (usually JSON) and is never decoded before verification. Unknown,
        removed or connecting instances answer 404 without saying which. A
        body over 5 MiB answers 413 and nothing is stored. A bad signature
        answers 401 and nothing is stored. A new delivery is stored and
        queued (202); one whose signed body or delivery ID was seen before
        is a duplicate (200, nothing queued).
      tags: [apps]
      x-orglane-permission: public
      security: []
      parameters:
        - $ref: "#/components/parameters/InstanceId"
      requestBody:
        required: true
        content:
          "*/*":
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: A duplicate delivery; nothing was queued.
        "202":
          description: The delivery was stored and queued.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: The body is larger than 5 MiB.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "500":
          $ref: "#/components/responses/InternalError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-orglane_session
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PersonId:
      name: personId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: invitationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: provider
      in: path
      required: true
      description: A provider ID, e.g. github.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,30}$"
    LinkId:
      name: linkId
      in: path
      required: true
      description: A verified account link ID.
      schema:
        type: string
        format: uuid
    InstanceId:
      name: instanceId
      in: path
      required: true
      description: An app instance ID.
      schema:
        type: string
        format: uuid
    CredentialName:
      name: credentialName
      in: path
      required: true
      description: A credential name declared by the instance's provider.
      schema:
        type: string
        pattern: "^[a-z][a-z0-9_]{0,40}$"
        example: webhook_secret
  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The resource does not exist (or belongs to someone else).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Too many attempts; retry after the given number of seconds.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: The request has no valid credentials.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: |
        The caller lacks the permission this operation requires, or a
        cookie-authenticated request failed the CSRF checks.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: An unexpected server error.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: The resource expired.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadGateway:
      description: An upstream server (for example the SMTP server) failed; `detail` says how.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    OnboardingStep:
      type: object
      required: [id, title, description, required, complete]
      properties:
        id:
          type: string
          description: Stable namespaced employee step ID; built-ins use profile, profile-admin, avatar and passkey.
        title:
          type: string
        description:
          type: string
        required:
          type: boolean
          description: Required steps always have a usable authorized action for the subject.
        complete:
          type: boolean
          description: Actual current completion; skipping an optional step never completes it.
        actionUrl:
          type: string
          description: Authorized local action link for the caller; absent for an action they cannot perform.
    OnboardingProgress:
      type: object
      required: [personId, welcomePending, steps]
      properties:
        personId:
          type: string
          format: uuid
        welcomePending:
          type: boolean
          description: Only disclosed for self. True after an accepted invitation until welcome is finished.
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStep"
    PeopleImportMapping:
      type: object
      additionalProperties: false
      required: [columns, createTeams, sendInvitations, skipRows]
      properties:
        columns:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [column, target]
            properties:
              column: { type: integer, minimum: 0, maximum: 99 }
              target: { type: string, maxLength: 100 }
        createTeams: { type: boolean }
        sendInvitations: { type: boolean }
        skipRows:
          type: array
          maxItems: 2000
          description: GitHub runs allow 2000 skips; file runs remain limited to 1000.
          items: { type: integer, minimum: 2, maximum: 1048576 }
    PeopleImportRow:
      type: object
      required: [row, decision, error, result]
      properties:
        row: { type: integer }
        decision: { type: string, enum: [create, update, skip, conflict] }
        error: { type: string, description: Fixed error code; never contains a source value. }
        result: { type: string, enum: [pending, created, updated, skipped, failed] }
    PeopleImport:
      type: object
      required:
        [id, state, source, encoding, delimiter, headers, mapping, rows, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [staged, previewed, applied] }
        source: { type: string }
        encoding: { type: string }
        delimiter: { type: string }
        headers:
          type: array
          items: { type: string }
        mapping: { $ref: "#/components/schemas/PeopleImportMapping" }
        rows:
          type: array
          items: { $ref: "#/components/schemas/PeopleImportRow" }
        createdAt: { type: string, format: date-time }
        expiresAt:
          type: string
          format: date-time
          description: |
            When the run is deleted automatically: 24 hours after upload until
            it is applied, then 90 days after apply. Afterwards every operation
            on the run returns 404.
    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:
          type: string
          description: A URI reference identifying the problem type. `about:blank` means the HTTP status says it all.
          example: about:blank
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: Forbidden
        status:
          type: integer
          description: The HTTP status code.
          example: 403
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence.
        instance:
          type: string
          description: A URI reference identifying this occurrence (the request path).
        code:
          type: string
          description: A stable, machine-readable error code where the operation documents one, e.g. key_reserved or batch_changed.
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        checks:
          type: array
          items:
            $ref: "#/components/schemas/HealthCheck"
    HealthCheck:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          example: database
        status:
          type: string
          enum: [ok, unavailable]
    Version:
      type: object
      required: [version]
      properties:
        version:
          type: string
          example: v0.1.0
    Instance:
      type: object
      required: [version, baseDomain, workspaceHost]
      properties:
        version:
          type: string
          example: v0.1.0
        baseDomain:
          type: string
          description: The company base domain.
          example: acme.com
        workspaceHost:
          type: string
          description: The host the workspace is served on.
          example: work.acme.com
    OrglaneDiscovery:
      type: object
      required: [workspaceUrl, apiBaseUrl, issuer, version, demo]
      properties:
        workspaceUrl:
          type: string
          description: The workspace URL.
          example: https://work.acme.com
        apiBaseUrl:
          type: string
          description: The base URL of this API.
          example: https://work.acme.com/api/v1
        issuer:
          type: string
          description: The OpenID Connect issuer (append `/.well-known/openid-configuration` for its metadata).
          example: https://work.acme.com
        version:
          type: string
          example: v0.1.0
        demo:
          type: boolean
          description: |
            True when the instance runs in demo mode: its data is the demo
            dataset and anyone who can reach it may sign in as a demo person
            with one click (`GET /api/v1/demo`, `POST /api/v1/demo/sign-in`).
            Clients should show a clear "demo" marker.
    SetupStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True while no owner exists and setup can be completed with the setup token.
    SetupRequest:
      type: object
      required: [setupToken, workEmail, username, displayName, password]
      properties:
        setupToken:
          type: string
          description: The one-time setup token from the server log or `orglane cli setup-token`.
        workEmail:
          type: string
          example: alex@acme.com
        username:
          type: string
          example: alex
        displayName:
          type: string
          example: Alex Morgan
        password:
          type: string
          format: password
          minLength: 12
          description: At least 12 characters.
    PasswordSignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: alex@acme.com
        password:
          type: string
          format: password
    PasskeyCeremony:
      type: object
      required: [ceremonyId, publicKey]
      properties:
        ceremonyId:
          type: string
          format: uuid
          description: Identifies the ceremony when finishing it.
        publicKey:
          type: object
          additionalProperties: true
          description: |
            WebAuthn options (PublicKeyCredentialCreationOptions or
            PublicKeyCredentialRequestOptions) with binary values in
            base64url, as accepted by `PublicKeyCredential.parse*OptionsFromJSON`.
    PasskeySignInRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          format: uuid
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from `navigator.credentials.get`, serialized with `toJSON()`.
    AddPasskeyRequest:
      type: object
      required: [ceremonyId, credential]
      properties:
        ceremonyId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
          description: A name for the passkey, e.g. "MacBook". Defaults to "Passkey".
        credential:
          type: object
          additionalProperties: true
          description: The PublicKeyCredential from `navigator.credentials.create`, serialized with `toJSON()`.
    PersonSummary:
      type: object
      required: [id, username, workEmail, displayName]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        workEmail:
          type: string
        displayName:
          type: string
    SignInResult:
      type: object
      required: [person, csrfToken, passkeyOffer, sessionExpiresAt]
      properties:
        person:
          $ref: "#/components/schemas/PersonSummary"
        csrfToken:
          type: string
          description: Send it in the `X-CSRF-Token` header of state-changing requests.
        passkeyOffer:
          type: boolean
          description: True when the person has no passkey and has not skipped the offer recently; offer to add one, with a "Skip" option.
        sessionExpiresAt:
          type: string
          format: date-time
    Me:
      type: object
      required: [person, permissions, passkeyOffer]
      properties:
        welcomePending:
          type: boolean
          description: An invited person has not yet finished welcome; optional setup and ordinary sign-in are preserved.
        person:
          $ref: "#/components/schemas/PersonSummary"
        permissions:
          type: array
          items:
            type: string
          description: The permissions the caller holds (ADR 0004).
        passkeyOffer:
          type: boolean
        session:
          $ref: "#/components/schemas/Session"
        csrfToken:
          type: string
          description: Present for browser sessions.
    Device:
      type: object
      required: [id, name, platform]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Firefox on macOS
        platform:
          type: string
          enum: [web, ios, android]
    Session:
      type: object
      required: [id, device, createdAt, lastSeenAt, expiresAt, authMethods, current]
      properties:
        id:
          type: string
          format: uuid
        device:
          $ref: "#/components/schemas/Device"
        createdAt:
          type: string
          format: date-time
          description: When the person signed in.
        lastSeenAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: The absolute expiry; the session also ends after a period of inactivity.
        authMethods:
          type: array
          items:
            type: string
            enum: [password, passkey, demo]
          description: "`demo` is the one-click sign-in of demo mode (no credential)."
        current:
          type: boolean
          description: True for the session making the request.
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
    Passkey:
      type: object
      required: [id, name, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
    PasskeyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Passkey"
    Person:
      type: object
      required: [id, username, workEmail, displayName, status, roles, teams, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: maya.okafor
        workEmail:
          type: string
          example: maya.okafor@acme.com
        displayName:
          type: string
          example: Maya Okafor
        title:
          type: string
          description: The job title, if set.
          example: Chief Executive Officer
        status:
          $ref: "#/components/schemas/PersonStatus"
        roles:
          type: array
          items:
            type: string
          description: Keys of the roles the person holds, e.g. `owner`, `admin`, `member` (ADR 0004). The UI translates built-in roles by key.
        avatarUrl:
          type: string
          description: Path of the avatar image (`GET /api/v1/people/{personId}/avatar`), if the person has one.
          example: /api/v1/people/0192b7a0-0000-7000-8000-000000000000/avatar
        updatedAt:
          type: string
          format: date-time
          description: Last public directory change; private contact email and custom/sensitive profile updates do not advance it.
        managerId:
          type: string
          format: uuid
        teams:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryTeam"
    DirectoryTeam:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
    PersonUpdate:
      type: object
      additionalProperties: false
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        username: { type: string, minLength: 1, maxLength: 63 }
        workEmail: { type: string, maxLength: 254 }
        managerId:
          type: string
          description: UUID of the manager, or empty string to remove. Admin-only.
    PersonStatus:
      type: string
      enum: [invited, active, suspended, offboarded]
      description: "`invited`: added, has not signed in yet; `active`: can sign in; `suspended`: temporarily blocked. Offboarded people appear only as incremental-cache tombstones."
    PersonList:
      type: object
      required: [items]
      properties:
        nextCursor:
          type: string
          format: uuid
          description: Omitted on the last page.
        items:
          type: array
          items:
            $ref: "#/components/schemas/Person"
    Team:
      type: object
      required: [id, slug, name, memberCount, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          description: Identifies the team in URLs and, later, in provider mappings. Unique across all teams, archived ones included.
          example: platform
        name:
          type: string
          example: Platform
        description:
          type: string
          description: What the team does, if set.
          example: Robot software, firmware and the fleet cloud.
        parentId:
          type: string
          format: uuid
          description: The parent team, if any (prepared for the org chart).
        memberCount:
          type: integer
          description: How many people are in the team (offboarded people not counted).
          example: 4
        archivedAt:
          type: string
          format: date-time
          description: When the team was archived. Archived teams are read-only.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Team"
    CreateTeamRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          maxLength: 100
          example: Platform
        slug:
          type: string
          maxLength: 63
          description: 1-63 characters of a-z, 0-9 and `-`, starting and ending with a letter or digit; normalized to lower case.
          example: platform
        description:
          type: string
          maxLength: 1000
        parentId:
          type: string
          format: uuid
          description: The parent team. It must be an active team.
    UpdateTeamRequest:
      type: object
      description: The fields to change; omitted fields stay unchanged.
      properties:
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 63
        description:
          type: string
          maxLength: 1000
          description: An empty string removes the description.
        parentId:
          type: string
          description: The ID of the new parent team (an active team, not this team or one below it), or an empty string to remove the parent.
    SetTeamMemberRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/TeamRole"
    TeamRole:
      type: string
      enum: [member, lead]
      x-enum-varnames: [TeamRoleMember, TeamRoleLead]
      description: A person's role in a team. A team may have any number of leads, including none.
    TeamMembership:
      type: object
      required: [teamId, personId, role, joinedAt]
      properties:
        teamId:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        role:
          $ref: "#/components/schemas/TeamRole"
        joinedAt:
          type: string
          format: date-time
    TeamMember:
      type: object
      required: [person, role, joinedAt]
      properties:
        person:
          $ref: "#/components/schemas/PersonCard"
        role:
          $ref: "#/components/schemas/TeamRole"
        joinedAt:
          type: string
          format: date-time
    TeamMemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
    PersonCard:
      type: object
      description: A person as shown in lists of other things, such as a team's members.
      required: [id, username, displayName, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
          example: priya.raman
        displayName:
          type: string
          example: Priya Raman
        title:
          type: string
          example: Senior Robotics Engineer
        status:
          $ref: "#/components/schemas/PersonStatus"
        avatarUrl:
          type: string
          description: Path of the avatar image, if the person has one.
    PersonTeam:
      type: object
      required: [team, role]
      properties:
        team:
          $ref: "#/components/schemas/Team"
        role:
          $ref: "#/components/schemas/TeamRole"
    PersonTeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PersonTeam"
    ProfileFieldType:
      type: string
      enum: [text, long_text, date, select, phone, url, handle]
      description: |
        How values are validated and stored: `text` (one line, at most 200
        characters), `long_text` (at most 2000 characters), `date`
        (`YYYY-MM-DD`), `select` (an option key), `phone` (E.164, such as
        `+442079460958`), `url` (http or https, at most 2000 Unicode
        characters), `handle` (an account name
        on the service of `handleKind`, without `@`; Mastodon:
        `user@instance`).
    ProfileFieldHandleKind:
      type: string
      enum: [telegram, github, gitlab, x, mastodon]
    ProfileFieldSection:
      type: string
      enum: [contacts, personal, hr, custom]
    ProfileFieldVisibility:
      type: string
      enum: [everyone, team, admins]
      description: |
        Who sees the values besides the person and holders of
        `people.manage`: every signed-in person, people sharing a team with
        the person, or nobody else.
    ProfileFieldEditor:
      type: string
      enum: [self, admins]
      description: "`self`: the person and holders of `people.manage`; `admins`: holders of `people.manage` only."
    ProfileFieldOption:
      type: object
      required: [key, label]
      properties:
        key:
          type: string
          description: Stored as the value. Derived from the label when omitted on create.
          example: berlin
        label:
          type: string
          maxLength: 100
          example: Berlin
    ProfileField:
      type: object
      required:
        [
          id,
          key,
          library,
          label,
          type,
          options,
          section,
          visibility,
          requiredAtOnboarding,
          editableBy,
          userCanHide,
          sensitive,
          position,
          archived,
        ]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          example: telegram
        library:
          type: boolean
          description: True for fields from the library. Their key is the library key; clients translate the label by it.
        label:
          type: string
          description: The English label (library fields) or the admin's label (custom fields).
          example: Telegram
        type:
          $ref: "#/components/schemas/ProfileFieldType"
        handleKind:
          $ref: "#/components/schemas/ProfileFieldHandleKind"
        options:
          type: array
          description: The choices of a select field; empty for other types.
          items:
            $ref: "#/components/schemas/ProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        requiredAtOnboarding:
          type: boolean
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
          description: The person may hide their value from everyone except holders of `people.manage`.
        sensitive:
          type: boolean
          description: Values are encrypted at rest, readable only by holders of `people.sensitive.read`, and every read is audited.
        position:
          type: integer
          description: Order within the section, ascending.
        archived:
          type: boolean
    ProfileFieldList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileField"
    NewProfileField:
      type: object
      required: [label, type]
      properties:
        key:
          type: string
          description: Lower case a-z, 0-9 and `_`, starting with a letter. Derived from the label when omitted. Library keys are reserved.
          example: office
        label:
          type: string
          maxLength: 100
          example: Office
        type:
          $ref: "#/components/schemas/ProfileFieldType"
        handleKind:
          $ref: "#/components/schemas/ProfileFieldHandleKind"
        options:
          type: array
          description: Required for select fields.
          items:
            $ref: "#/components/schemas/NewProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        requiredAtOnboarding:
          type: boolean
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
        sensitive:
          type: boolean
    NewProfileFieldOption:
      type: object
      required: [label]
      properties:
        key:
          type: string
          description: Derived from the label when omitted.
        label:
          type: string
          maxLength: 100
    ProfileFieldUpdate:
      type: object
      description: The settings to change; omitted ones stay. Declassifying sensitive values or changing their select options also requires people.sensitive.read, and reads of existing sensitive values are audited.
      properties:
        label:
          type: string
          maxLength: 100
        options:
          type: array
          description: Replaces the options of a select field. Keep an option's key to keep its values.
          items:
            $ref: "#/components/schemas/NewProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        requiredAtOnboarding:
          type: boolean
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
        sensitive:
          type: boolean
        position:
          type: integer
          minimum: 0
          maximum: 1000000
        archived:
          type: boolean
    ProfileFieldLibraryEntry:
      type: object
      required: [key, label, type, options, section, visibility, editableBy, userCanHide, sensitive]
      properties:
        key:
          type: string
          example: birthday
        label:
          type: string
          description: The English label; clients translate it by key.
          example: Birthday
        type:
          $ref: "#/components/schemas/ProfileFieldType"
        handleKind:
          $ref: "#/components/schemas/ProfileFieldHandleKind"
        options:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldOption"
        section:
          $ref: "#/components/schemas/ProfileFieldSection"
        visibility:
          $ref: "#/components/schemas/ProfileFieldVisibility"
        editableBy:
          $ref: "#/components/schemas/ProfileFieldEditor"
        userCanHide:
          type: boolean
        sensitive:
          type: boolean
        field:
          $ref: "#/components/schemas/ProfileField"
    ProfileFieldLibrary:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldLibraryEntry"
    ProfileFieldValue:
      type: object
      required: [field, hidden, yearHidden, editable, hideable]
      properties:
        field:
          $ref: "#/components/schemas/ProfileField"
        value:
          type: string
          description: |
            The value, absent when unset or hidden from the caller. Dates are
            `YYYY-MM-DD`; a birthday without its year is `--MM-DD`. Select
            fields hold an option key.
          example: "--03-14"
        hidden:
          type: boolean
          description: The person hid the value from others (reported only to those who still see it).
        yearHidden:
          type: boolean
          description: The value is a birthday shown without its year.
        editable:
          type: boolean
          description: The caller may set or clear the value.
        hideable:
          type: boolean
          description: The caller (the person) may hide the value.
    PersonProfile:
      type: object
      required: [personId, fields]
      properties:
        personId:
          type: string
          format: uuid
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ProfileFieldValue"
    ProfileFieldValueChange:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The field key.
          example: telegram
        value:
          type: string
          description: |
            The new value; an empty string clears it; omit to leave it.
            Validated by the field type (see `ProfileFieldType`) and stored
            normalized (for example a phone number in E.164, a handle
            without `@`).
          example: maya_okafor
        hidden:
          type: boolean
          description: Hide (true) or show (false) the value; only the person, and hiding only when the field allows it.
    PersonProfileUpdate:
      type: object
      required: [values]
      properties:
        values:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ProfileFieldValueChange"
    DemoInfo:
      type: object
      required: [dataset, company, defaultUsername, people]
      properties:
        dataset:
          type: string
          description: The dataset identifier.
          example: acme
        company:
          type: string
          description: The demo company name.
          example: Acme Robotics
        defaultUsername:
          type: string
          description: Who `POST /api/v1/demo/sign-in` signs in as without a username (the Owner).
          example: maya.okafor
        people:
          type: array
          description: The people one can sign in as, in dataset order.
          items:
            $ref: "#/components/schemas/DemoPerson"
    DemoPerson:
      type: object
      required: [username, displayName, role]
      properties:
        username:
          type: string
          example: maya.okafor
        displayName:
          type: string
          example: Maya Okafor
        title:
          type: string
          example: Chief Executive Officer
        role:
          type: string
          description: The key of the person's built-in role (`owner`, `admin` or `member`).
          example: owner
    DemoSignInRequest:
      type: object
      properties:
        username:
          type: string
          description: The demo person to sign in as. Defaults to `defaultUsername` of `GET /api/v1/demo`.
          example: maya.okafor
    InvitationTokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: The token from the invitation link (`/invite#<token>`).
    AcceptInvitationRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          format: password
          minLength: 12
          description: At least 12 characters.
    InvitationPreview:
      type: object
      required: [displayName, username, workEmail, expiresAt]
      properties:
        displayName:
          type: string
          example: Maya Okafor
        username:
          type: string
          example: maya.okafor
        workEmail:
          type: string
          example: maya.okafor@acme.com
        expiresAt:
          type: string
          format: date-time
    CreateInvitationRequest:
      type: object
      required: [displayName, contactEmail, username, role]
      properties:
        displayName:
          type: string
          maxLength: 200
          example: Maya Okafor
        contactEmail:
          type: string
          description: Where the invitation goes, e.g. a personal address. Kept as the person's contact email, separate from the work email.
          example: maya@example.com
        username:
          type: string
          example: maya.okafor
        workEmail:
          type: string
          description: The person's work email (their identity in the workspace). Defaults to `workEmailPattern` of the invitation options with the username.
          example: maya.okafor@acme.com
        title:
          type: string
          maxLength: 200
          example: Robotics Engineer
        role:
          type: string
          description: The key of the role the person gets (`owner`, `admin` or `member`).
          example: member
        teamIds:
          type: array
          maxItems: 100
          uniqueItems: true
          description: Initial active teams. Memberships (as member), role, person and invitation are created atomically.
          items:
            type: string
            format: uuid
    InvitationDelivery:
      type: string
      enum: [email, link]
      description: "`email`: sent through a trusted channel to the contact email; `link`: email is absent or cannot safely carry this permission grant, share the link yourself."
    IssuedInvitation:
      type: object
      required: [invitation]
      properties:
        invitation:
          $ref: "#/components/schemas/Invitation"
        link:
          type: string
          description: The invitation link, only with delivery `link`. It is shown once; resend to get a new one.
          example: https://work.acme.com/invite#oli_...
    Invitation:
      type: object
      required:
        [
          id,
          personId,
          displayName,
          username,
          workEmail,
          contactEmail,
          roles,
          status,
          delivery,
          createdAt,
          issuedAt,
          expiresAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        personId:
          type: string
          format: uuid
        displayName:
          type: string
        username:
          type: string
        workEmail:
          type: string
        contactEmail:
          type: string
        roles:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [pending, expired, revoked]
        delivery:
          $ref: "#/components/schemas/InvitationDelivery"
        email:
          $ref: "#/components/schemas/EmailDelivery"
        invitedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        issuedAt:
          type: string
          format: date-time
          description: When the current link was issued (the last resend).
        expiresAt:
          type: string
          format: date-time
    EmailDelivery:
      type: object
      required: [status, attempts, maxAttempts]
      description: The delivery state of an invitation email.
      properties:
        status:
          type: string
          enum: [queued, retrying, sent, failed, canceled]
          description: "`retrying`: at least one attempt failed and another is scheduled; `failed`: every attempt failed."
        attempts:
          type: integer
        maxAttempts:
          type: integer
        lastError:
          type: string
          description: A bounded safe category for the last failure. Untrusted relay text, bearer tokens and credentials are never exposed.
        sentAt:
          type: string
          format: date-time
    InvitationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Invitation"
    InvitationOptions:
      type: object
      required: [delivery, workEmailPattern, lifetimeHours, roles, roleDeliveries]
      properties:
        delivery:
          $ref: "#/components/schemas/InvitationDelivery"
        workEmailPattern:
          type: string
          description: The default work email with `{username}` in place of the username.
          example: "{username}@acme.com"
        lifetimeHours:
          type: integer
          description: How long a new link stays valid.
          example: 168
        roles:
          type: array
          description: Role keys that this caller has permission to grant.
          items:
            type: string
        roleDeliveries:
          type: object
          description: Delivery for each grantable role. Editable SMTP uses a link for permissions outside the guaranteed SMTP-editor envelope.
          additionalProperties:
            $ref: "#/components/schemas/InvitationDelivery"
    EmailTLSMode:
      type: string
      enum: [starttls, tls, none]
      description: "`starttls` (port 587) upgrades the connection and refuses to continue without TLS; `tls` (port 465) connects with TLS; `none` sends in the clear (a relay on the same host or trusted network only)."
    EmailSettings:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [none, settings, config]
          description: "`none`: email is not configured (invitations produce links); `settings`: saved here; `config`: set by the server configuration, read-only."
        host:
          type: string
          example: smtp.example.com
        port:
          type: integer
          example: 587
        tls:
          $ref: "#/components/schemas/EmailTLSMode"
        username:
          type: string
        passwordSet:
          type: boolean
          description: True when a password is stored (it is never returned).
        from:
          type: string
          example: Acme <no-reply@acme.com>
    EmailSettingsInput:
      type: object
      required: [host, tls, from]
      properties:
        host:
          type: string
          example: smtp.example.com
        port:
          type: integer
          minimum: 1
          maximum: 65535
          description: Defaults to the usual port of the TLS mode.
        tls:
          $ref: "#/components/schemas/EmailTLSMode"
        username:
          type: string
          description: Empty for a server without authentication.
        password:
          type: string
          format: password
          description: Omit to keep the saved password.
        from:
          type: string
          description: The sender, a bare address or "Name <address>".
          example: Acme <no-reply@acme.com>
    TestEmailRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          example: alex@example.com
    GitHubConnectStep:
      type: object
      additionalProperties: false
      required: [instanceId, done]
      properties:
        instanceId: { type: string, format: uuid }
        done: { type: boolean }
        name: { type: string }
        method: { type: string, enum: [GET, POST] }
        url: { type: string, format: uri }
        form:
          type: object
          additionalProperties: { type: string }
    AppManagement:
      type: string
      description: "`managed`: Orglane runs the service through the agent; `connected`: an external service Orglane talks to."
      enum: [managed, connected]
    AppAccessPolicy:
      type: string
      description: "`all_people`: every active person; `mapped_teams`: members of mapped teams only."
      enum: [all_people, mapped_teams]
    AppInstanceState:
      type: string
      enum:
        [
          connecting,
          installing,
          active,
          degraded,
          upgrading,
          failed,
          disconnected,
          removing,
          removed,
        ]
    AppHealth:
      type: string
      enum: [unknown, healthy, unhealthy]
    AppFeatureSupport:
      type: object
      description: One cell of the capability matrix.
      required: [feature, support]
      properties:
        feature:
          type: string
          example: accounts.create
        support:
          type: string
          enum: [supported, partial, planned, unsupported]
        note:
          type: string
          description: An i18n key explaining the cell.
          example: providers.github.features.accounts_invite_only
        milestone:
          type: string
          description: For `planned`, the milestone, e.g. M5.
    AppCredentialSpec:
      type: object
      required: [name, source, rotatable, agent]
      properties:
        name:
          type: string
          example: webhook_secret
        source:
          type: string
          enum: [generated, provider, upload, identity]
          description: >-
            Where the value comes from: generated by Orglane, from the
            provider, uploaded by an admin, or issued by Orglane's OpenID
            Provider for the instance's OIDC client (identity).
        rotatable:
          type: boolean
        agent:
          type: boolean
          description: Passed to the agent as a secret input (managed packages); rotates with the managed service.
    AppDeepLink:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Absolute URL on the instance's base URL origin.
    AppSettingSpec:
      type: object
      required: [name, type, mutable, required]
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, int, bool]
        pattern:
          type: string
          description: Strings only; an RE2 pattern the whole value must match.
        enum:
          type: array
          items:
            type: string
        min:
          type: integer
          format: int64
        max:
          type: integer
          format: int64
        default:
          description: The default value (a JSON scalar).
        mutable:
          type: boolean
          description: False if fixed once the instance is created.
        required:
          type: boolean
          description: >-
            True if the instance needs it: creating an instance without it
            (and without a default) is refused, and it cannot be removed.
    AppEmployeeStep:
      type: object
      required: [id, title, description, actionPath, required]
      properties:
        id:
          type: string
          example: github.link-account
        title:
          type: string
          description: English fallback; the UI translates `onboarding.steps.<id>.title`.
        description:
          type: string
        actionPath:
          type: string
        required:
          type: boolean
    AppProvider:
      type: object
      required:
        [
          id,
          name,
          capabilities,
          management,
          features,
          credentials,
          settings,
          employeeSteps,
          defaultKey,
          defaultPolicy,
          provisioning,
          webhooks,
          lifecycle,
        ]
      properties:
        id:
          type: string
          example: forgejo
        name:
          type: string
          description: English display name; the UI translates `providers.<id>.name`.
        capabilities:
          type: array
          items:
            type: string
            example: code
        management:
          $ref: "#/components/schemas/AppManagement"
        package:
          type: string
          description: The managed package ID (managed providers only).
        features:
          type: array
          description: The capability matrix, every feature in matrix order.
          items:
            $ref: "#/components/schemas/AppFeatureSupport"
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/AppCredentialSpec"
        settings:
          type: array
          items:
            $ref: "#/components/schemas/AppSettingSpec"
        employeeSteps:
          type: array
          items:
            $ref: "#/components/schemas/AppEmployeeStep"
        defaultKey:
          type: string
        defaultPolicy:
          $ref: "#/components/schemas/AppAccessPolicy"
        provisioning:
          type: boolean
          description: The adapter provisions people.
        webhooks:
          type: boolean
          description: The adapter receives webhooks.
        lifecycle:
          type: boolean
          description: The adapter has a managed lifecycle (setup, health).
        install:
          $ref: "#/components/schemas/AppInstallDefaults"
    AppInstallDefaults:
      type: object
      description: |
        What an install of a managed provider uses when the request leaves
        it out, and the package's resource hints. Present only for managed
        providers whose package is embedded in this server.
      required: [key, host, settings, packageVersion, memoryMin, memoryRecommended, diskMin]
      properties:
        key:
          type: string
        host:
          type: string
          example: git.acme.com
        settings:
          type: object
          additionalProperties: true
          description: Defaults that depend on this installation (e.g. Forgejo's organization).
        packageVersion:
          type: string
          example: 15.0.11-1
        memoryMin:
          type: integer
          format: int64
          description: Bytes the package needs at least (hint, not a limit).
        memoryRecommended:
          type: integer
          format: int64
        diskMin:
          type: integer
          format: int64
    InstallAppInstanceRequest:
      type: object
      required: [provider]
      properties:
        provider:
          type: string
          example: forgejo
        key:
          type: string
          description: Defaults to the provider's default key.
          maxLength: 24
        displayName:
          type: string
          maxLength: 100
        host:
          type: string
          maxLength: 253
          description: The public host; defaults to `AppProvider.install.host`.
        settings:
          type: object
          additionalProperties: true
    AppAgentStatus:
      type: object
      required: [enabled, connected, memTotal, memAvailable, diskFree, memoryReserved]
      properties:
        enabled:
          type: boolean
          description: Managed services are configured (agent socket and secret).
        connected:
          type: boolean
          description: The agent answers with this server's version.
        code:
          type: string
          enum: [agent_unavailable, agent_version_mismatch, agent_untrusted]
          description: Why it is not connected.
        version:
          type: string
        memTotal:
          type: integer
          format: int64
        memAvailable:
          type: integer
          format: int64
        diskFree:
          type: integer
          format: int64
          description: Free bytes where the instances' data lives.
        memoryReserved:
          type: integer
          format: int64
          description: The bundle's share plus the minimum memory of every installed managed app.
    AppProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppProvider"
    AppInstance:
      type: object
      required:
        [
          id,
          key,
          provider,
          providerAvailable,
          management,
          displayName,
          state,
          health,
          accessPolicy,
          manageExistingMembers,
          settings,
          dataRetained,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          description: Short, stable, immutable ID (directory, Compose project and database names).
          example: git
        provider:
          type: string
          example: forgejo
        providerAvailable:
          type: boolean
          description: False if the provider is not compiled into this server.
        management:
          $ref: "#/components/schemas/AppManagement"
        displayName:
          type: string
        state:
          $ref: "#/components/schemas/AppInstanceState"
        health:
          $ref: "#/components/schemas/AppHealth"
        healthCode:
          type: string
          description: Stable reason code of the health or state, e.g. setup_failed.
        healthCheckedAt:
          type: string
          format: date-time
        baseUrl:
          type: string
          description: The public base URL, once known.
        accessPolicy:
          $ref: "#/components/schemas/AppAccessPolicy"
        manageExistingMembers:
          type: boolean
          description: Pre-existing provider members are managed (and may be removed). Off by default.
        packageId:
          type: string
        packageVersion:
          type: string
        settings:
          type: object
          description: Non-secret provider settings.
          additionalProperties: true
        webhookUrl:
          type: string
          description: Where the provider delivers webhooks (providers that take webhooks).
        dataRetained:
          type: boolean
        waitingForAgent:
          type: string
          enum: [agent_unavailable, agent_version_mismatch, agent_untrusted]
          description: |
            Set while a change of this managed instance waits for the agent,
            with the reason: the agent is not running or not reachable, runs
            another Orglane version, or does not prove the shared key.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        removedAt:
          type: string
          format: date-time
    AppInstanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppInstance"
    AppOperation:
      type: object
      required: [id, kind, state, createdAt]
      properties:
        id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
        kind:
          type: string
          enum: [apply, upgrade, snapshot, restore, remove]
        reason:
          type: string
          enum: [install, configure, upgrade, retry, revert, remove, reinstall, resync]
          description: Why the desired state changed (operations that push one).
        state:
          type: string
          enum: [queued, running, awaiting_confirmation, succeeded, failed, rolled_back]
        phase:
          type: string
        errorCode:
          type: string
          description: |
            Why a finished operation failed: an agent code such as
            `compose_failed`, or `superseded` when a newer generation
            replaced it before it ran. While unfinished: why it waits for the
            agent (`agent_unavailable`, `agent_version_mismatch`,
            `agent_untrusted`).
        fromVersion:
          type: string
        toVersion:
          type: string
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
    AppOperationList:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppOperation"
        hasMore:
          type: boolean
          description: More operations follow this page.
    AppCredentialVersion:
      type: object
      description: A credential version, never its value.
      required: [name, version, state, createdAt]
      properties:
        name:
          type: string
        version:
          type: integer
        state:
          type: string
          enum: [pending, uncertain, abandoning, active, retiring]
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type: string
          format: date-time
        retireAt:
          type: string
          format: date-time
    AppCredentialRotationStatus:
      type: object
      required: [name, version, state]
      properties:
        name: { type: string }
        version: { type: integer }
        state:
          type: string
          description: |
            `activated_by_admin` and `discarded_by_admin` are an admin's forced
            resolution, recorded without evidence from the provider; they are
            not verification.
          enum:
            [
              accepted,
              verifying,
              failed,
              verified,
              cancelling,
              cancelled,
              activated_by_admin,
              discarded_by_admin,
            ]
    AppProvisioningCounts:
      type: object
      required: [queued, done, pendingEmployeeAction, failed]
      properties:
        queued:
          type: integer
        done:
          type: integer
        pendingEmployeeAction:
          type: integer
        failed:
          type: integer
    AppInstanceDetail:
      type: object
      required:
        [
          instance,
          bindings,
          operations,
          credentials,
          credentialRotations,
          credentialDrift,
          rotationStuck,
          unmanagedAccountCount,
          provisioning,
        ]
      properties:
        instance:
          $ref: "#/components/schemas/AppInstance"
        bindings:
          type: array
          items:
            type: object
            required: [capability, isDefault]
            properties:
              capability:
                type: string
              isDefault:
                type: boolean
        operations:
          type: array
          description: The last 10 agent operations (managed instances).
          items:
            $ref: "#/components/schemas/AppOperation"
        credentials:
          type: array
          items:
            $ref: "#/components/schemas/AppCredentialVersion"
        credentialRotations:
          type: array
          description: Latest staged rotation per credential, including safe terminal outcomes retained after candidate cleanup. Never contains key values or provider diagnostics.
          items:
            $ref: "#/components/schemas/AppCredentialRotationStatus"
        credentialDrift:
          type: array
          description: Older credential versions a delivery was signed with after they stopped being in use, since the current version became active. Rotate the credential to recover. Never contains values.
          items:
            type: object
            required: [name, version, detectedAt]
            properties:
              name: { type: string }
              version: { type: integer }
              detectedAt: { type: string, format: date-time }
        rotationStuck:
          type: boolean
          description: A credential rotation has been uncertain for more than 24 hours.
        unmanagedAccountCount:
          type: integer
        provisioning:
          $ref: "#/components/schemas/AppProvisioningCounts"
    UpdateAppInstanceRequest:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        accessPolicy:
          $ref: "#/components/schemas/AppAccessPolicy"
        manageExistingMembers:
          type: boolean
        settings:
          type: object
          additionalProperties: true
    AppCredentialRotation:
      type: object
      required: [name, version]
      properties:
        name:
          type: string
        version:
          type: integer
    AppBinding:
      type: object
      required:
        [
          capability,
          instanceId,
          instanceKey,
          instanceDisplayName,
          provider,
          instanceState,
          isDefault,
        ]
      properties:
        capability:
          type: string
          example: code
        instanceId:
          type: string
          format: uuid
        instanceKey:
          type: string
        instanceDisplayName:
          type: string
        provider:
          type: string
        instanceState:
          $ref: "#/components/schemas/AppInstanceState"
        isDefault:
          type: boolean
    AppBindingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppBinding"
    SetDefaultAppBindingRequest:
      type: object
      required: [instanceId]
      properties:
        instanceId:
          type: string
          format: uuid
    AppTeamMappingMode:
      type: string
      description: "`create`: Orglane creates a provider team named after the team slug; `existing`: an existing provider team."
      enum: [create, existing]
    AppTeamMapping:
      type: object
      required: [teamId, teamSlug, teamName, teamArchived, mode, createdAt, updatedAt]
      properties:
        teamId:
          type: string
          format: uuid
        teamSlug:
          type: string
        teamName:
          type: string
        teamArchived:
          type: boolean
          description: Archived teams keep their mapping but grant nothing.
        mode:
          $ref: "#/components/schemas/AppTeamMappingMode"
        externalRef:
          type: string
          description: The provider team ID, once created or chosen.
        externalName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AppTeamMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AppTeamMapping"
    SetAppTeamMappingRequest:
      type: object
      required: [mode]
      properties:
        mode:
          $ref: "#/components/schemas/AppTeamMappingMode"
        externalRef:
          type: string
          maxLength: 100
          description: The provider team (mode existing only).
        externalName:
          type: string
          maxLength: 100
    ProvisioningStatus:
      type: string
      description: |
        `queued`: a change was detected, the job has not finished;
        `done`: the provider matches the desired access;
        `pending_employee_action`: nothing can happen until the person acts
        (`employeeStep` names the step); `failed`: an action failed
        permanently or its retries are exhausted (`errorCode`).
      enum: [queued, done, pending_employee_action, failed]
    ProvisioningActionResult:
      type: object
      required: [kind, key, outcome, removal]
      properties:
        kind:
          type: string
          example: add_to_team
        key:
          type: string
        outcome:
          type: string
          enum: [changed, unchanged, failed, not_attempted, held]
        removal:
          type: boolean
        errorCode:
          type: string
    ProvisioningResult:
      type: object
      required: [person, status, access, grantedByOrglane, actions, attempts, updatedAt]
      properties:
        person:
          $ref: "#/components/schemas/PersonCard"
        status:
          $ref: "#/components/schemas/ProvisioningStatus"
        access:
          type: boolean
          description: The desired access at the last plan.
        employeeStep:
          type: string
        grantedByOrglane:
          type: boolean
        actions:
          type: array
          items:
            $ref: "#/components/schemas/ProvisioningActionResult"
        errorCode:
          type: string
        attempts:
          type: integer
        lastAttemptAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UnmanagedAccount:
      type: object
      required: [externalId, login, seenAt]
      properties:
        externalId:
          type: string
        login:
          type: string
        seenAt:
          type: string
          format: date-time
    HeldRemoval:
      type: object
      required: [id, person, kind, key]
      properties:
        id:
          type: string
          format: uuid
        person:
          $ref: "#/components/schemas/PersonCard"
        kind:
          type: string
          example: remove_from_team
        key:
          type: string
    HeldRemovalBatch:
      type: object
      required: [id, itemCount, itemsHash, createdAt, items]
      properties:
        id:
          type: string
          format: uuid
        itemCount:
          type: integer
        itemsHash:
          type: string
          description: Hex SHA-256 over the batch items; send it back to confirm exactly what was shown.
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: "#/components/schemas/HeldRemoval"
    AppProvisioning:
      type: object
      required: [items, counts, unmanagedAccounts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProvisioningResult"
        counts:
          $ref: "#/components/schemas/AppProvisioningCounts"
        unmanagedAccounts:
          type: array
          description: Provider accounts Orglane does not manage. Reported, never removed.
          items:
            $ref: "#/components/schemas/UnmanagedAccount"
        heldRemovals:
          $ref: "#/components/schemas/HeldRemovalBatch"
    PlannedAction:
      type: object
      required: [kind, key, removal]
      properties:
        kind:
          type: string
        key:
          type: string
        removal:
          type: boolean
    PlannedPerson:
      type: object
      required: [person, access, actions]
      properties:
        person:
          $ref: "#/components/schemas/PersonCard"
        access:
          type: boolean
        actions:
          type: array
          items:
            $ref: "#/components/schemas/PlannedAction"
        employeeStep:
          type: string
        errorCode:
          type: string
    AppProvisioningPlan:
      type: object
      required: [items, truncated]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlannedPerson"
        truncated:
          type: boolean
          description: More than 1000 people; only the first were planned.
    RetryAppProvisioningRequest:
      type: object
      properties:
        personId:
          type: string
          format: uuid
          description: Only this person's failed result.
    AppProvisioningRetry:
      type: object
      required: [queued]
      properties:
        queued:
          type: integer
    ConfirmAppRemovalBatchRequest:
      type: object
      required: [itemsHash]
      properties:
        itemsHash:
          type: string
          pattern: "^[0-9a-f]{64}$"
    PersonAppResult:
      type: object
      required:
        [
          instanceId,
          instanceKey,
          instanceDisplayName,
          provider,
          instanceState,
          status,
          access,
          updatedAt,
        ]
      properties:
        instanceId:
          type: string
          format: uuid
        instanceKey:
          type: string
        instanceDisplayName:
          type: string
        provider:
          type: string
        instanceState:
          $ref: "#/components/schemas/AppInstanceState"
        status:
          $ref: "#/components/schemas/ProvisioningStatus"
        access:
          type: boolean
        employeeStep:
          type: string
        errorCode:
          type: string
        updatedAt:
          type: string
          format: date-time
    AccountLinkView:
      type: object
      description: |
        A link between a person and a provider account. `verified` links are
        proven (OAuth from the person's own session, or an account Orglane
        created); `pending` is import evidence that proves nothing.
      required: [provider, login, externalId, state]
      properties:
        id:
          type: string
          format: uuid
          description: Verified links only.
        provider:
          type: string
        realm:
          type: string
        login:
          type: string
        externalId:
          type: string
        state:
          type: string
          enum: [verified, pending]
        method:
          type: string
          enum: [oauth, provisioned]
        evidence:
          type: string
          enum: [matched, mismatched, none]
        organizationId:
          type: integer
          format: int64
          description: Pending GitHub evidence only.
        instanceId:
          type: string
          format: uuid
        verifiedAt:
          type: string
          format: date-time
        conflict:
          type: boolean
          description: Pending evidence only. The account it names is verified for another person.
    MyAccountLinks:
      type: object
      required: [links, linkable]
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/AccountLinkView"
        linkable:
          type: array
          description: Providers where the caller can verify an account, with the instance used.
          items:
            $ref: "#/components/schemas/LinkableProvider"
    LinkableProvider:
      type: object
      required: [provider, instanceId, displayName]
      properties:
        provider: { type: string }
        instanceId: { type: string, format: uuid }
        displayName: { type: string }
    PersonApps:
      type: object
      required: [results, links]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/PersonAppResult"
        links:
          type: array
          items:
            $ref: "#/components/schemas/AccountLinkView"
    MyApp:
      type: object
      required: [instanceId, key, displayName, provider, capabilities, status]
      properties:
        instanceId:
          type: string
          format: uuid
        key:
          type: string
        displayName:
          type: string
        provider:
          type: string
        capabilities:
          type: array
          items:
            type: string
        homeUrl:
          type: string
          description: The instance's base URL, once known.
        status:
          $ref: "#/components/schemas/ProvisioningStatus"
        employeeStep:
          type: string
        actionPath:
          type: string
          description: Where the caller completes `employeeStep` (a local path).
    MyAppList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MyApp"
