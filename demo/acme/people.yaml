# People of the "Acme Robotics" demo dataset. Every person is active and has
# no password: in demo mode they sign in with one click.
#
# Fields:
#   username      account name (a-z, 0-9, '.', '_', '-')
#   display_name  full name as shown in the UI
#   work_email    must use the company email domain (dataset.yaml)
#   title         job title
#   role          built-in role: owner, admin or member (exactly one owner)
#   avatar        image file relative to this directory; the SVG initials
#                 avatars are generated with `go generate ./demo`
#
# Teams and profile fields arrive in M1 as new keys and files.
people:
  - username: maya.okafor
    display_name: Maya Okafor
    work_email: maya.okafor@acme-robotics.example
    title: Chief Executive Officer
    role: owner
    avatar: avatars/maya.okafor.svg

