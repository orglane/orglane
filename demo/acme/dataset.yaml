# The "Acme Robotics" demo dataset: demo mode (`orglane server --demo`),
# screenshots, end-to-end tests and module previews. See demo/README.md.
#
# `version` changes when the dataset changes in a way loaders or tests must
# know about. Entities live in their own files, so later milestones add
# files (teams.yaml, profile_fields.yaml, ...) next to people.yaml.
version: 1
company:
  name: Acme Robotics
  # Reserved for documentation (RFC 2606): never a real mailbox.
  email_domain: acme-robotics.example
# Who one-click sign-in uses when no person is chosen: the Owner.
default_username: maya.okafor
