# Research fixture, not a production package. Passwords are disposable examples.
services:
  app:
    image: nextcloud:35.0.2-apache
    ports: ["127.0.0.1:18103:80"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: research
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: research-pass-1
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1
    volumes: ["html:/var/www/html"]
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: research
    volumes: ["db:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud"]
      interval: 2s
      retries: 30
volumes:
  html:
  db:
